<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitar reserva por WhatsApp | i-Motion EMS Tenerife</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container" style="max-width:640px;padding:48px 20px">
<a href="/" class="accent">Volver a Inicio</a>
<h1>Solicita tu sesión</h1>
<form class="contact-form" data-whatsapp-request>
  <div class="form-group"><label>Nombre <input name="nombre" required maxlength="80" autocomplete="given-name"></label></div>
  <div class="form-group"><label>Programa <select name="programa" required>
    <option value="">Selecciona un programa</option><option>i-Motion Sport</option><option>i-Shape Esthetic</option><option>Aún no lo sé</option>
  </select></label></div>
  <div class="form-group"><label>Preferencia de horario (opcional) <input name="horario" maxlength="120" placeholder="Por ejemplo, de lunes a viernes por la tarde"></label></div>
  <p>Se abrirá WhatsApp con tu solicitud. Pulsa Enviar y te responderemos con una hora disponible.</p>
  <button class="btn btn-primary" type="submit">Solicitar reserva por WhatsApp</button>
</form>
<script defer src="/js/whatsapp-request.js"></script>
</main>
<script defer src="/js/analytics.js?v=2"></script>
</body>
</html>
