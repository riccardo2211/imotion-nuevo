<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>i-Motion Trainer App</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#f0f0f0;font-family:'Outfit',sans-serif;font-size:14px;min-height:100vh}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:16px}
.btn{background:#00aaff;color:#fff;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:600;font-size:13px;font-family:'Outfit',sans-serif}
.btn:hover{background:#0099ee}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{background:#00aaff;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12px;font-family:'Outfit',sans-serif}
.btn-ghost{background:transparent;color:#888;border:1px solid #333;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;font-family:'Outfit',sans-serif}
.btn-ghost:hover{border-color:#555;color:#ccc}
input,select,textarea{background:#111;border:1px solid #333;border-radius:8px;padding:9px 12px;color:#f0f0f0;font-size:13px;width:100%;font-family:'Outfit',sans-serif;outline:none}
input:focus,select:focus{border-color:#00aaff}
.tag{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-block}
.spinner{width:32px;height:32px;border:3px solid #2a2a2a;border-top:3px solid #00aaff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* NAV */
.nav{background:#111;border-bottom:1px solid #222;padding:0 20px;display:flex;align-items:center;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:50}
.nav-logo{font-weight:800;color:#00aaff;font-size:18px;margin-right:16px;white-space:nowrap;letter-spacing:-0.5px}
.nav-btn{background:none;border:none;color:#666;border-bottom:2px solid transparent;padding:16px 12px;cursor:pointer;font-size:13px;white-space:nowrap;font-family:'Outfit',sans-serif;font-weight:500;transition:color .2s}
.nav-btn:hover{color:#aaa}
.nav-btn.active{color:#00aaff;border-bottom-color:#00aaff;font-weight:700}

/* EXERCISE CARDS — Harbiz style */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ex-card{background:#1a1a1a;border:1px solid #222;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.ex-card:hover{transform:translateY(-2px);border-color:#444}
.ex-thumb{position:relative;width:100%;padding-bottom:56.25%;background:#111;overflow:hidden}
.ex-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%);display:flex;align-items:flex-end;padding:10px}
.ex-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;background:rgba(0,170,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.ex-body{padding:12px}
.ex-name{font-weight:700;font-size:14px;margin-bottom:6px;line-height:1.3}
.ex-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.ex-desc{font-size:11px;color:#666;line-height:1.4}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
.modal-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-video{position:relative;padding-bottom:56.25%;background:#000;margin:16px 0 0}
.modal-video iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.modal-content{padding:16px 20px 20px}

/* STEPS */
.steps{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#ccc;line-height:1.5}
.step-num{background:#00aaff22;color:#00aaff;border:1px solid #00aaff44;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}

/* FILTERS */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:5px 14px;cursor:pointer;font-size:12px;color:#888;font-family:'Outfit',sans-serif;font-weight:500;transition:all .15s}
.filter-btn:hover{border-color:#555;color:#ccc}
.filter-btn.active{background:#00aaff22;border-color:#00aaff;color:#00aaff;font-weight:600}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#1a1a1a;border:1px solid #222;border-radius:12px;padding:16px;text-align:center}
.stat-val{font-size:32px;font-weight:800;line-height:1}
.stat-lbl{font-size:12px;color:#666;margin-top:4px}

/* ROUTINE EDITOR */
.day-block{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:12px}
.day-title{font-weight:700;color:#00aaff;margin-bottom:10px;font-size:14px}
.ex-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1e1e1e}
.ex-row:last-of-type{border-bottom:none}

/* NUTRI */
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.macro-card{background:#111;border:1px solid #222;border-radius:10px;padding:12px;text-align:center}
.macro-val{font-size:22px;font-weight:800}
.macro-lbl{font-size:10px;color:#666;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.meal-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #1e1e1e;font-size:13px;align-items:flex-start}
.meal-num{background:#00aaff22;color:#00aaff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}

/* PROGRESS */
.prog-entry{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111;border:1px solid #1e1e1e;border-radius:10px;margin-bottom:8px}

label.lbl{font-size:11px;color:#666;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
#app{max-width:980px;margin:0 auto;padding:20px}
.hidden{display:none!important}
.search-wrap{position:relative;max-width:300px;margin-bottom:14px}
.search-wrap input{padding-left:34px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#555;font-size:15px}
</style>
</head>
<body>

<div id="nav" class="nav hidden"></div>
<div id="app"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwy1JyochqSC-OvimvpHTSWedgUiZrzjeHXl79-Mbg0BlBnxcweCzI6P1ZOqH2Qo5CJWA/exec";
let currentUser = null, currentTab = null;
let _exercises = null, _clients = [], _routines = [], _nutrition = [];

// ── API ────────────────────────────────────────────────────
async function apiGet(params) {
  const r = await fetch(API + "?" + new URLSearchParams(params));
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

// ── Utils ──────────────────────────────────────────────────
function tag(text, color) {
  return `<span class="tag" style="background:${color}18;color:${color};border:1px solid ${color}40">${text}</span>`;
}
function spinner(text="Cargando…") {
  return `<div style="text-align:center;padding:60px"><div class="spinner"></div><div style="color:#555;margin-top:14px;font-size:13px">${text}</div></div>`;
}
function render(html) { document.getElementById("app").innerHTML = html; }

// Thumbnail de YouTube
function ytThumb(videoUrl) {
  const match = videoUrl.match(/embed\/([^?]+)/);
  if (!match) return "";
  return `https://img.youtube.com/vi/${match[1]}/mqdefault.jpg`;
}

// ── Nav ────────────────────────────────────────────────────
function renderNav() {
  const tabs = currentUser.rol === "trainer"
    ? ["Dashboard","Clientes","Ejercicios","Rutinas","Nutrición"]
    : ["Mi Entrenamiento","Ejercicios","Mi Nutrición","Mi Progreso"];
  const nav = document.getElementById("nav");
  nav.classList.remove("hidden");
  nav.innerHTML = `
    <span class="nav-logo">i-Motion</span>
    ${tabs.map(t=>`<button class="nav-btn${t===currentTab?' active':''}" onclick="setTab('${t}')">${t}</button>`).join("")}
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;padding-left:12px;flex-shrink:0">
      <span style="font-size:12px;color:#555">${currentUser.nombre}</span>
      <button class="btn-ghost" onclick="logout()">Salir</button>
    </div>`;
}
function setTab(t){currentTab=t;renderNav();renderTab();}
function logout(){currentUser=null;currentTab=null;_exercises=null;document.getElementById("nav").classList.add("hidden");renderLogin();}

// ── Login ──────────────────────────────────────────────────
function renderLogin(){
  render(`
    <div style="display:flex;align-items:center;justify-content:center;min-height:90vh">
      <div class="card" style="width:340px;text-align:center;padding:32px">
        <div style="font-size:30px;font-weight:800;color:#00aaff;margin-bottom:4px;letter-spacing:-1px">i-Motion</div>
        <div style="color:#555;margin-bottom:28px;font-size:12px;font-weight:500">EMS TRAINER PLATFORM</div>
        <div style="text-align:left;margin-bottom:12px">
          <label class="lbl">Email</label>
          <input id="lemail" placeholder="trainer@imotion.com"/>
        </div>
        <div style="text-align:left;margin-bottom:20px">
          <label class="lbl">Contraseña</label>
          <input id="lpass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
        </div>
        <div id="lerr" style="color:#ff5555;font-size:12px;margin-bottom:12px"></div>
        <button class="btn" style="width:100%;padding:11px" id="lbtn" onclick="doLogin()">Entrar</button>
        <div style="margin-top:20px;font-size:11px;color:#444;line-height:1.8">
          trainer@imotion.com — imotion2024<br>
          carlos@demo.com / maria@demo.com — 1234
        </div>
      </div>
    </div>`);
}

async function doLogin(){
  const email=document.getElementById("lemail").value.trim();
  const pass=document.getElementById("lpass").value;
  const btn=document.getElementById("lbtn");
  const errEl=document.getElementById("lerr");
  if(!email||!pass)return;
  btn.disabled=true;btn.textContent="Verificando…";errEl.textContent="";
  try{
    const user=await apiGet({action:"login",email,password:pass});
    currentUser=user;
    currentTab=user.rol==="trainer"?"Dashboard":"Mi Entrenamiento";
    renderNav();renderTab();
  }catch(e){
    errEl.textContent=e.message;
    btn.disabled=false;btn.textContent="Entrar";
  }
}

function renderTab(){
  if(currentUser.rol==="trainer"){
    if(currentTab==="Dashboard")renderDashboard();
    else if(currentTab==="Clientes")renderClients();
    else if(currentTab==="Ejercicios")renderExercises();
    else if(currentTab==="Rutinas")renderRoutines();
    else if(currentTab==="Nutrición")renderNutrition();
  }else{
    if(currentTab==="Mi Entrenamiento")renderClientTraining();
    else if(currentTab==="Ejercicios")renderExercises();

async function openRoutineEditor(routineId){
  const routine=_routines.find(r=>String(r.id)===String(routineId));
  const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const availDays=DAYS.filter(d=>!(routine.days||[]).find(x=>x.dia===d));
  const exOptions=CATS.filter(c=>c!=="Todos").map(cat=>`<optgroup label="${cat}">${_exercises.filter(e=>e.categoria===cat).map(e=>`<option value="${e.id}">${e.nombre}</option>`).join("")}</optgroup>`).join("");

  document.body.insertAdjacentHTML("beforeend",`
    <div class="modal-bg" id="remodal" style="align-items:flex-start;overflow-y:auto;padding:20px">
      <div class="modal-box" style="max-width:620px;width:100%;margin:0 auto">
        <div class="modal-header" style="padding:20px">
          <div style="font-weight:800;font-size:20px">${routine.nombre}</div>
          <button class="btn-ghost" onclick="document.getElementById('remodal').remove();renderRoutines()">✓ Cerrar</button>
        </div>
        <div style="padding:0 20px 20px">
          <div style="display:flex;gap:8px;margin-bottom:18px">
            <select id="newday" style="flex:1">
              <option value="">+ Añadir día de entrenamiento…</option>
              ${availDays.map(d=>`<option>${d}</option>`).join("")}
            </select>
            <button class="btn" onclick="addDayToRoutine('${routine.id}')">Añadir</button>
          </div>
          <div id="days-container">
            ${(routine.days||[]).map(d=>`
              <div class="day-block" id="day-${d.id}">
                <div class="day-title">📅 ${d.dia}</div>
                <div id="exlist-${d.id}">
                  ${(d.exercises||[]).map(ex=>{
                    const exData=_exercises.find(e=>String(e.id)===String(ex.exerciseId));
                    return `<div class="ex-row" id="exrow-${ex.id}">
                      <div style="flex:1">
                        <div style="font-weight:600;font-size:13px">${exData?.nombre||""}</div>
                        <div style="font-size:12px;color:#555">${ex.series} series × ${ex.reps} · Descanso ${ex.descanso}</div>
                      </div>
                      <button class="btn-ghost" style="color:#ff5555;border-color:#ff555540" onclick="removeExFromDay('${ex.id}','${d.id}')">✕</button>
                    </div>`;
                  }).join("")}
                </div>
                <select style="margin-top:10px;font-size:12px" onchange="addExToDay('${d.id}',this.value);this.value=''">
                  <option value="">+ Añadir ejercicio a ${d.dia}…</option>
                  ${exOptions}
                </select>
              </div>`).join("")}
          </div>
        </div>
      </div>
    </div>`);
}

async function addDayToRoutine(routineId){
  const dia=document.getElementById("newday").value;
  if(!dia)return;
  await apiGet({action:"addDay",routineId,dia});
  document.getElementById("remodal")?.remove();
  _routines=await apiGet({action:"routines"});
  await openRoutineEditor(routineId);
}

async function addExToDay(dayId,exerciseId){
  if(!exerciseId)return;
  const{id}=await apiGet({action:"addExercise",dayId,exerciseId,series:3,reps:"10",descanso:"60s"});
  const ex=_exercises.find(e=>String(e.id)===String(exerciseId));
  const container=document.getElementById(`exlist-${dayId}`);
  if(container){
    container.insertAdjacentHTML("beforeend",`
      <div class="ex-row" id="exrow-${id}">
        <div style="flex:1">
          <div style="font-weight:600;font-size:13px">${ex?.nombre||""}</div>
          <div style="font-size:12px;color:#555">3 series × 10 · Descanso 60s</div>
        </div>
        <button class="btn-ghost" style="color:#ff5555;border-color:#ff555540" onclick="removeExFromDay('${id}','${dayId}')">✕</button>
      </div>`);
  }
}

async function removeExFromDay(exId,dayId){
  await apiGet({action:"removeExercise",id:exId});
  document.getElementById(`exrow-${exId}`)?.remove();
}

        <div style="font-weight:700;color:#00aaff;margin-bottom:14px;font-size:15px">📅 ${d.dia}</div>
        ${(d.exercises||[]).map((ex,ei)=>{
          const e=_exercises.find(e=>String(e.id)===String(ex.exerciseId));
          const k=`${di}-${ei}`;
          return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1e1e1e">
            <input type="checkbox" id="chk-${k}" style="width:18px;height:18px;cursor:pointer;accent-color:#00aaff" onchange="toggleEx('${k}')"/>
            <div style="flex:1">
              <div id="exname-${k}" style="font-weight:600;font-size:14px">${e?.nombre||""}</div>
              <div style="font-size:12px;color:#555;margin-top:2px">${ex.series} series × ${ex.reps} · Descanso: ${ex.descanso}</div>
            </div>
            ${e?`<button class="btn-sm" onclick="openExModal('${e.id}')">▶ Ver</button>`:""}
          </div>`;
        }).join("")}
      </div>`).join("")}`);
}

function toggleEx(k){
  const el=document.getElementById(`exname-${k}`);
  const chk=document.getElementById(`chk-${k}`);
  if(el){el.style.textDecoration=chk.checked?"line-through":"none";el.style.color=chk.checked?"#444":"#f0f0f0";}
}

// ── Cliente: Mi Nutrición ──────────────────────────────────
async function renderClientNutrition(){
  render(spinner("Cargando nutrición…"));
  const plans=await apiGet({action:"nutrition",clientId:currentUser.id});
  if(!plans[0]){render(`<div style="padding:60px;text-align:center;color:#444">Tu entrenador aún no te ha asignado un plan nutricional.</div>`);return;}
  render(`<div style="font-weight:800;font-size:20px;margin-bottom:18px">Mi Plan Nutricional</div>${nutriCard(plans[0])}`);
}

// ── Cliente: Mi Progreso ───────────────────────────────────
async function renderClientProgress(){
  render(spinner("Cargando progreso…"));
  const records=await apiGet({action:"progress",clientId:currentUser.id});
  render(`
    <div style="font-weight:800;font-size:20px;margin-bottom:18px">Mi Progreso</div>
    <div class="card" style="margin-bottom:20px">
      <div style="font-weight:700;margin-bottom:14px">Registrar hoy</div>
      <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-bottom:12px">
        <div>
          <label class="lbl">Peso (kg)</label>
          <input id="ppeso" type="number" step="0.1" placeholder="75.5"/>
        </div>
        <div>
          <label class="lbl">Notas</label>
          <input id="pnotas" placeholder="Cómo te has sentido hoy…"/>
        </div>
      </div>
      <button class="btn" onclick="saveProgress()">Guardar registro</button>
    </div>
    <div style="font-weight:700;font-size:15px;margin-bottom:12px">Historial (${records.length} registros)</div>
    ${records.length===0?`<div style="color:#444;font-size:13px">Aún no hay registros.</div>`:""}
    <div id="precords">
      ${[...records].reverse().map(r=>`
        <div class="prog-entry">
          <div>
            <div style="font-weight:600">${r.fecha}</div>
            ${r.notas?`<div style="font-size:12px;color:#555;margin-top:2px">${r.notas}</div>`:""}
          </div>
          <div style="font-size:28px;font-weight:800;color:#00aaff">${r.peso}<span style="font-size:14px;color:#555"> kg</span></div>
        </div>`).join("")}
    </div>`);
}

async function saveProgress(){
  const peso=document.getElementById("ppeso").value;
  const notas=document.getElementById("pnotas").value;
  if(!peso)return;
  await apiGet({action:"saveProgress",clienteId:currentUser.id,fecha:new Date().toLocaleDateString("es-ES"),peso,notas});
  renderClientProgress();
}

// ── Init ───────────────────────────────────────────────────
renderLogin();
