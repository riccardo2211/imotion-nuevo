<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>i-Motion App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb;--white:#fff;--border:#e5e8ef;
  --text:#1a1d2e;--muted:#8b95a8;
  --accent:#4361ee;--accent2:#3a0ca3;
  --success:#06d6a0;--warn:#ffd166;--danger:#ef476f;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
*{font-family:'Inter',sans-serif}

/* ── NAV ── */
.nav{background:var(--white);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 24px;gap:8px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-logo{font-weight:800;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:8px}
.nav-btn{background:none;border:none;color:var(--muted);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.nav-btn:hover{background:#f0f2ff;color:var(--accent)}
.nav-btn.active{background:#eef0ff;color:var(--accent);font-weight:700}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

/* ── LAYOUT ── */
.page{max-width:1000px;margin:0 auto;padding:28px 24px}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-hover{cursor:pointer;transition:all .15s}
.card-hover:hover{border-color:#c5cbf9;box-shadow:0 4px 16px rgba(67,97,238,.1);transform:translateY(-1px)}

/* ── BUTTONS ── */
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{background:#3451d1;box-shadow:0 4px 12px rgba(67,97,238,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:var(--white);color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;padding:9px 18px;font-weight:600;font-size:13px;cursor:pointer}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer}
.btn-danger{background:#fff0f3;color:var(--danger);border:1px solid #ffc0cb;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.btn-success{background:var(--success);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:600;font-size:13px;cursor:pointer}

/* ── INPUTS ── */
input,select,textarea{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(67,97,238,.1)}
label.lbl{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600}
.tag-blue{background:#eef0ff;color:var(--accent);border:1px solid #d5dbff}
.tag-green{background:#e6faf4;color:#00a87a;border:1px solid #b3edd8}
.tag-orange{background:#fff6e6;color:#d08000;border:1px solid #ffd98a}
.tag-red{background:#fff0f3;color:var(--danger);border:1px solid #ffc0cb}
.tag-gray{background:#f4f6fb;color:var(--muted);border:1px solid var(--border)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(3px);overflow-y:auto}
.modal{background:var(--white);border-radius:20px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.18)}
.modal-hd{padding:22px 24px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);border-radius:20px 20px 0 0;z-index:1}
.modal-title{font-weight:800;font-size:18px}
.modal-body{padding:20px 24px 24px}
.modal-close{background:#f4f6fb;border:none;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);cursor:pointer}
.modal-close:hover{background:#fee;color:var(--danger)}

/* ── EJERCICIOS VIDEO CARD ── */
.ex-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .15s}
.ex-card:hover{border-color:#c5cbf9;box-shadow:0 4px 16px rgba(67,97,238,.1)}
.ex-thumb{position:relative;width:100%;padding-bottom:56.25%;background:#1a1d2e;overflow:hidden}
.ex-thumb iframe,.ex-thumb img{position:absolute;inset:0;width:100%;height:100%;border:none;object-fit:cover}
.ex-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);cursor:pointer;transition:opacity .2s}
.ex-play-overlay:hover{background:rgba(0,0,0,.5)}
.play-btn{width:50px;height:50px;background:rgba(255,255,255,.95);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent)}

/* ── GRID ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* ── MISC ── */
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.section-title{font-weight:800;font-size:18px}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.hidden{display:none!important}
.empty{text-align:center;padding:50px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
.client-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0}
.msg-bubble{background:#f0f2ff;border-radius:12px 12px 12px 4px;padding:12px 14px;font-size:13px;line-height:1.6;max-width:85%;margin-bottom:8px;color:var(--text)}
.msg-bubble.mine{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:12px 12px 4px 12px;margin-left:auto}
.macro-box{background:#f9faff;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.macro-val{font-size:22px;font-weight:800;margin-bottom:2px}
.macro-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f2ff 0%,#e8f4ff 100%)}
.login-card{background:var(--white);border-radius:22px;padding:40px;width:360px;box-shadow:0 8px 40px rgba(67,97,238,.15)}
.login-logo{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}

/* ── TRAINING VIEW ── */
.training-day{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
.training-day-hd{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px 18px;font-weight:700;font-size:15px}
.training-ex{padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.training-ex:last-child{border-bottom:none}
.training-ex:hover{background:#f9faff}
.training-ex.done{opacity:.5}
.training-ex-expanded{padding:0 18px 16px;background:#f9faff;border-bottom:1px solid var(--border)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">i-Motion</div>
      <div style="color:var(--muted);font-size:12px;margin-bottom:28px;font-weight:500">EMS PERSONAL TRAINER</div>
      <div style="margin-bottom:14px">
        <label class="lbl">Email</label>
        <input id="l-email" type="email" placeholder="tu@email.com" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div style="margin-bottom:20px">
        <label class="lbl">Contraseña</label>
        <input id="l-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div id="l-err" style="color:var(--danger);font-size:12px;margin-bottom:12px;text-align:center"></div>
      <button class="btn" style="width:100%;justify-content:center;padding:12px" id="l-btn" onclick="doLogin()">Iniciar sesión</button>
      <div style="margin-top:18px;text-align:center;font-size:11px;color:var(--muted);line-height:1.9">
        trainer@imotion.com · imotion2024<br>carlos@demo.com / maria@demo.com · 1234
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="hidden">
  <nav class="nav" id="main-nav"></nav>
  <div class="page" id="main-page"></div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────
const API="https://script.google.com/macros/s/AKfycbw9zUMlHGIbwZclvRmVQU1mSWQib2c5W44cUR4RXvO-h2waJr1WLc1l61Iz123HgA8tGA/exec";
let U=null, TAB=null;
let _clients=[], _routines=[], _nutrition=[];

// ── API ───────────────────────────────────────────────────
async function api(params){
  const r=await fetch(API+"?"+new URLSearchParams(params));
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"Error");
  return j.data;
}

// ── UTILS ─────────────────────────────────────────────────
function render(html){document.getElementById("main-page").innerHTML=html;}
function spin(t="Cargando…"){return`<div style="text-align:center;padding:60px"><div class="spinner"></div><div style="color:var(--muted);margin-top:14px;font-size:13px">${t}</div></div>`;}
function closeModal(id){document.getElementById(id)?.remove();}
function ytId(url){return url?.match(/embed\/([^?]+)/)?.[1]||"";}
function ytThumb(url){const id=ytId(url);return id?`https://img.youtube.com/vi/${id}/mqdefault.jpg`:"";}

// ── LOGIN ─────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById("l-email").value.trim();
  const pass=document.getElementById("l-pass").value;
  const btn=document.getElementById("l-btn");
  const err=document.getElementById("l-err");
  if(!email||!pass)return;
  btn.disabled=true;btn.textContent="Verificando…";err.textContent="";
  try{
    U=await api({action:"login",email,password:pass});
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app-screen").classList.remove("hidden");
    TAB=U.rol==="trainer"?"clientes":"entrenamiento";
    renderNav();renderTab();
  }catch(e){
    err.textContent=e.message;
    btn.disabled=false;btn.textContent="Iniciar sesión";
  }
}

function logout(){
  U=null;TAB=null;
  document.getElementById("app-screen").classList.add("hidden");
  document.getElementById("login-screen").classList.remove("hidden");
  document.getElementById("l-email").value="";
  document.getElementById("l-pass").value="";
}

// ── NAV ───────────────────────────────────────────────────
function renderNav(){
  const trainerTabs=[
    {id:"clientes",label:"👥 Clientes"},
    {id:"rutinas",label:"⚡ Rutinas"},
    {id:"nutricion",label:"🥗 Nutrición"},
    {id:"mensajes",label:"💬 Mensajes"},
  ];
  const clientTabs=[
    {id:"entrenamiento",label:"💪 Mi Entrenamiento"},
    {id:"nutricion_c",label:"🥗 Mi Nutrición"},
    {id:"mensajes_c",label:"💬 Mensajes"},
    {id:"progreso",label:"📈 Mi Progreso"},
  ];
  const tabs=U.rol==="trainer"?trainerTabs:clientTabs;
  document.getElementById("main-nav").innerHTML=`
    <span class="nav-logo">i-Motion</span>
    ${tabs.map(t=>`<button class="nav-btn${TAB===t.id?" active":""}" onclick="goTab('${t.id}')">${t.label}</button>`).join("")}
    <div class="nav-right">
      <div class="avatar">${U.nombre[0]}</div>
      <span style="font-size:12px;color:var(--muted)">${U.nombre}</span>
      <button class="btn-ghost" onclick="logout()">Salir</button>
    </div>`;
}

function goTab(t){TAB=t;renderNav();renderTab();}
function renderTab(){
  if(U.rol==="trainer"){
    if(TAB==="clientes")renderClients();
    else if(TAB==="rutinas")renderRoutines();
    else if(TAB==="nutricion")renderNutricion();
    else if(TAB==="mensajes")renderMensajes();
  }else{
    if(TAB==="entrenamiento")renderEntrenamiento();
    else if(TAB==="nutricion_c")renderNutricionCliente();
    else if(TAB==="mensajes_c")renderMensajesCliente();
    else if(TAB==="progreso")renderProgreso();
  }
}

// ════════════════════════════════════════════════════════
// TRAINER VIEWS
// ════════════════════════════════════════════════════════

// ── CLIENTES ─────────────────────────────────────────────
async function renderClients(){
  render(spin("Cargando clientes…"));
  [_clients,_routines,_nutrition]=await Promise.all([
    api({action:"clients"}),
    api({action:"routines"}),
    api({action:"nutrition"}),
  ]);
  render(`
    <div class="section-hd">
      <div class="section-title">Clientes (${_clients.length})</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">
      ${_clients.map(c=>{
        const r=_routines.find(r=>String(r.clienteId)===String(c.id));
        const n=_nutrition.find(n=>String(n.clienteId)===String(c.id));
        return `<div class="card card-hover" onclick="openClientProfile('${c.id}')">
          <div class="flex" style="margin-bottom:14px">
            <div class="client-av">${c.nombre[0]}</div>
            <div>
              <div style="font-weight:700;font-size:15px">${c.nombre}</div>
              <div style="font-size:12px;color:var(--muted)">${c.email}</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:7px">
            <div class="flex-between">
              <span style="font-size:12px;color:var(--muted)">Rutina</span>
              ${r?`<span class="tag tag-green">${r.nombre}</span>`:`<span class="tag tag-orange">Sin asignar</span>`}
            </div>
            <div class="flex-between">
              <span style="font-size:12px;color:var(--muted)">Nutrición</span>
              ${n?`<span class="tag tag-green">${n.nombre}</span>`:`<span class="tag tag-orange">Sin asignar</span>`}
            </div>
          </div>
          <button class="btn" style="width:100%;justify-content:center;margin-top:14px;font-size:12px;padding:8px">Ver perfil →</button>
        </div>`;
      }).join("")}
    </div>`);
}

async function openClientProfile(clientId){
  const c=_clients.find(c=>String(c.id)===String(clientId));
  const assigned=_routines.find(r=>String(r.clienteId)===String(clientId));
  const nutri=_nutrition.find(n=>String(n.clienteId)===String(clientId));

  // Build routine days HTML
  let rutinaHtml="";
  if(assigned){
    rutinaHtml=`<div style="font-weight:600;color:var(--accent);margin-bottom:10px">${assigned.nombre}</div>`;
    (assigned.days||[]).forEach(d=>{
      rutinaHtml+=`<div style="margin-bottom:8px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px">📅 ${d.dia}</div>
        ${(d.exercises||[]).map(ex=>`<div style="font-size:12px;padding:2px 0 2px 12px;color:#444">• ${ex.nombre||"Ejercicio"} — ${ex.series}×${ex.reps}</div>`).join("")}
      </div>`;
    });
  }

  document.body.insertAdjacentHTML("beforeend",`
    <div class="modal-bg" id="cp-modal" onclick="if(event.target===this)closeModal('cp-modal')">
      <div class="modal" style="max-width:680px">
        <div class="modal-hd">
          <div class="flex" style="gap:12px">
            <div class="client-av" style="width:48px;height:48px;font-size:18px">${c.nombre[0]}</div>
            <div>
              <div class="modal-title">${c.nombre}</div>
              <div style="font-size:12px;color:var(--muted)">${c.email}</div>
            </div>
          </div>
          <button class="modal-close" onclick="closeModal('cp-modal')">✕</button>
        </div>
        <div class="modal-body">

          <!-- TABS -->
          <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:18px">
            ${["💪 Rutina","🥗 Nutrición","💬 Mensaje"].map((t,i)=>`
              <button id="cptab-${i}" onclick="switchCPTab(${i})" style="background:none;border:none;border-bottom:2px solid ${i===0?'var(--accent)':'transparent'};color:${i===0?'var(--accent)':'var(--muted)'};padding:8px 16px;font-size:13px;font-weight:${i===0?700:500};cursor:pointer;font-family:'Inter',sans-serif">${t}</button>`).join("")}
          </div>

          <!-- TAB 0: RUTINA -->
          <div id="cp-tab-0">
            <div style="margin-bottom:14px">
              <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Rutina actual</div>
              ${assigned?`<div class="card" style="background:#f9faff;padding:14px">${rutinaHtml}</div>`:`<div style="color:var(--muted);font-size:13px;margin-bottom:10px">Sin rutina asignada.</div>`}
            </div>
            <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Asignar rutina</div>
            ${_routines.map(r=>`
              <div onclick="assignRutina('${r.id}','${clientId}')" style="background:#f9faff;border:1.5px solid ${assigned?.id==r.id?'var(--accent)':'var(--border)'};border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
                <div>
                  <div style="font-weight:600">${r.nombre}</div>
                  <div style="font-size:11px;color:var(--muted)">${r.days?.length||0} días</div>
                </div>
                ${assigned?.id==r.id?`<span class="tag tag-blue">✓ Asignada</span>`:`<span style="font-size:12px;color:var(--accent);font-weight:600">Asignar →</span>`}
              </div>`).join("")||`<div style="color:var(--muted);font-size:13px">No hay rutinas creadas aún.</div>`}
          </div>

          <!-- TAB 1: NUTRICIÓN -->
          <div id="cp-tab-1" class="hidden">
            ${nutri?`<div class="card" style="background:#f9faff;padding:14px;margin-bottom:14px">
              <div style="font-weight:600;margin-bottom:8px">${nutri.nombre}</div>
              <div class="grid-4" style="margin-bottom:0">
                <div class="macro-box"><div class="macro-val" style="color:#e08a00">${nutri.kcal}</div><div class="macro-lbl">kcal</div></div>
                <div class="macro-box"><div class="macro-val" style="color:var(--accent)">${nutri.proteina}g</div><div class="macro-lbl">prot</div></div>
                <div class="macro-box"><div class="macro-val" style="color:#00a87a">${nutri.carbos}g</div><div class="macro-lbl">carbs</div></div>
                <div class="macro-box"><div class="macro-val" style="color:#9b59b6">${nutri.grasas}g</div><div class="macro-lbl">grasas</div></div>
              </div>
            </div>`:`<div style="color:var(--muted);font-size:13px;margin-bottom:14px">Sin plan asignado.</div>`}
            <button class="btn" onclick="closeModal('cp-modal');goTab('nutricion')">🥗 Gestionar nutrición →</button>
          </div>

          <!-- TAB 2: MENSAJE -->
          <div id="cp-tab-2" class="hidden">
            <label class="lbl">Escribir mensaje a ${c.nombre}</label>
            <textarea id="msg-text-${clientId}" placeholder="Instrucciones, motivación, feedback…" style="min-height:120px;resize:vertical;margin-bottom:12px"></textarea>
            <button class="btn-success" style="width:100%;justify-content:center" onclick="sendMsg('${clientId}')">📤 Enviar mensaje</button>
          </div>

        </div>
      </div>
    </div>`);
}

function switchCPTab(idx){
  [0,1,2].forEach(i=>{
    const btn=document.getElementById(`cptab-${i}`);
    const tab=document.getElementById(`cp-tab-${i}`);
    btn.style.borderBottomColor=i===idx?'var(--accent)':'transparent';
    btn.style.color=i===idx?'var(--accent)':'var(--muted)';
    btn.style.fontWeight=i===idx?'700':'500';
    tab?.classList.toggle("hidden",i!==idx);
  });
}

async function assignRutina(routineId,clientId){
  await api({action:"assignRoutine",routineId,clienteId:clientId});
  closeModal("cp-modal");
  renderClients();
}

async function sendMsg(clientId){
  const text=document.getElementById(`msg-text-${clientId}`)?.value?.trim();

async function openRoutineEditor(routineId){
  const r=_routines.find(r=>String(r.id)===String(routineId));
  const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const avail=DAYS.filter(d=>!(r.days||[]).find(x=>x.dia===d));

  let daysHtml=(r.days||[]).map((d,di)=>`
    <div style="background:#f9faff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px" id="day-${d.id}">
      <div class="flex-between" style="margin-bottom:10px">
        <div style="font-weight:700;color:var(--accent)">📅 ${d.dia}</div>
        <button class="btn-danger" onclick="removeDay('${d.id}','${routineId}')">✕ Eliminar día</button>
      </div>
      <div id="exlist-${d.id}">
        ${(d.exercises||[]).map(ex=>`
          <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border)" id="exrow-${ex.id}">
            <div style="flex:1">
              <div style="font-weight:600;font-size:13px">${ex.nombre||"Ejercicio"}</div>
              <div style="font-size:11px;color:var(--muted)">${ex.series} series × ${ex.reps} · ${ex.descanso}</div>
            </div>
            <button class="btn-danger" onclick="removeEx('${ex.id}')">✕</button>
          </div>`).join("")}
      </div>
      <button class="btn-outline" style="width:100%;justify-content:center;margin-top:10px;font-size:12px" onclick="showAddEx('${d.id}')">+ Añadir ejercicio</button>
    </div>`).join("");

  document.body.insertAdjacentHTML("beforeend",`
    <div class="modal-bg" id="re-modal" style="align-items:flex-start;overflow-y:auto;padding:20px">
      <div class="modal" style="max-width:640px;width:100%;margin:0 auto">
        <div class="modal-hd">
          <div class="modal-title">${r.nombre}</div>
          <button class="modal-close" onclick="closeModal('re-modal');renderRoutines()">✕</button>
        </div>
        <div class="modal-body">
          <div class="flex" style="margin-bottom:16px">
            <select id="new-day-sel" style="flex:1">
              <option value="">+ Añadir día…</option>
              ${avail.map(d=>`<option>${d}</option>`).join("")}
            </select>
            <button class="btn" onclick="addDay('${routineId}')">Añadir</button>
          </div>
          <div id="days-container">${daysHtml}</div>
        </div>
      </div>
    </div>`);
}

async function addDay(routineId){
  const dia=document.getElementById("new-day-sel")?.value;

  await api({action:"addDay",routineId,dia});

async function addEx(dayId){
  const nombre=document.getElementById("ex-nombre").value.trim();
  if(!nombre){alert("Escribe el nombre del ejercicio");return;}
  const series=document.getElementById("ex-series").value||"3";
  const reps=document.getElementById("ex-reps").value||"10";
  const descanso=document.getElementById("ex-descanso").value||"60s";
  let video=document.getElementById("ex-video").value.trim();

  // Convert YouTube watch URL to embed
  if(video.includes("youtube.com/watch")){
    const id=video.match(/[?&]v=([^&]+)/)?.[1];
    if(id)video=`https://www.youtube.com/embed/${id}`;
  }else if(video.includes("youtu.be/")){
    const id=video.split("youtu.be/")[1]?.split("?")[0];
    if(id)video=`https://www.youtube.com/embed/${id}`;
  }

  const {id}=await api({action:"addExercise",dayId,exerciseId:nombre,series,reps,descanso,nombre,video:video||""});

  const container=document.getElementById(`exlist-${dayId}`);
  if(container){
    container.insertAdjacentHTML("beforeend",`
      <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border)" id="exrow-${id}">
        <div style="flex:1">
          <div style="font-weight:600;font-size:13px">${nombre}</div>
          <div style="font-size:11px;color:var(--muted)">${series} series × ${reps} · ${descanso}</div>
        </div>
        <button class="btn-danger" onclick="removeEx('${id}')">✕</button>
      </div>`);
  }
  closeModal("addex-modal");
}

async function removeEx(exId){
  await api({action:"removeExercise",id:exId});
  document.getElementById(`exrow-${exId}`)?.remove();
}

function toggleEx(di,ei){
  const panel=document.getElementById(`exv-${di}-${ei}`);
  const arr=document.getElementById(`arr-${di}-${ei}`);
  const isOpen=!panel.classList.contains("hidden");
  panel.classList.toggle("hidden",isOpen);
  if(arr)arr.style.transform=isOpen?"":"rotate(90deg)";
}

function markDone(cb,rowId){
  const row=document.getElementById(rowId);
  if(row)row.classList.toggle("done",cb.checked);
}

    const meals=String(p.comidas).split("|");

      <div style="font-weight:800;font-size:22px;margin-bottom:18px">Mi Plan Nutricional</div>
      <div class="grid-4" style="margin-bottom:20px">
        <div class="macro-box"><div class="macro-val" style="color:#e08a00">${p.kcal}</div><div class="macro-lbl">kcal</div></div>
        <div class="macro-box"><div class="macro-val" style="color:var(--accent)">${p.proteina}g</div><div class="macro-lbl">prot</div></div>
        <div class="macro-box"><div class="macro-val" style="color:#00a87a">${p.carbos}g</div><div class="macro-lbl">carbs</div></div>
        <div class="macro-box"><div class="macro-val" style="color:#9b59b6">${p.grasas}g</div><div class="macro-lbl">grasas</div></div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:12px">${p.nombre}</div>
        ${meals.map((m,i)=>`<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><div style="background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${i+1}</div><span>${m}</span></div>`).join("")}
      </div>`);
  }
}

function selectMealVariant(mi,vi,total){
  for(let i=0;i<total;i++){
    const btn=document.getElementById(`mvt-${mi}-${i}`);
    const panel=document.getElementById(`mvp-${mi}-${i}`);
    if(btn){btn.style.background=i===vi?'var(--accent)':'#f4f6fb';btn.style.color=i===vi?'#fff':'var(--muted)';btn.style.borderColor=i===vi?'var(--accent)':'var(--border)';}
    if(panel)panel.style.display=i===vi?'block':'none';
  }
}

// ── MENSAJES CLIENTE ──────────────────────────────────────
async function renderMensajesCliente(){
  render(spin("Cargando…"));
  let msg="";
  try{
    const clients=await api({action:"clients"});
    const me=clients.find(c=>String(c.id)===String(U.id));
    msg=me?.comentario||"";
  }catch(e){}
  render(`
    <div style="font-weight:800;font-size:22px;margin-bottom:18px">💬 Mensajes de tu entrenador</div>
    ${msg?`
      <div class="card" style="margin-bottom:14px">
        <div class="flex" style="margin-bottom:10px">
          <div class="client-av" style="background:linear-gradient(135deg,#4361ee,#3a0ca3)">R</div>
          <div>
            <div style="font-weight:700">Ric — i-Motion</div>
            <div style="font-size:11px;color:var(--muted)">Tu entrenador personal</div>
          </div>
        </div>
        <div class="msg-bubble">${msg}</div>
      </div>`
    :`<div class="empty"><div class="empty-icon">💬</div><div style="font-weight:700">Sin mensajes aún</div><div style="font-size:13px;margin-top:6px">Tu entrenador te enviará mensajes aquí.</div></div>`}
  `);
}

// ── MI PROGRESO ───────────────────────────────────────────
async function renderProgreso(){
  render(spin("Cargando…"));
  const records=await api({action:"progress",clientId:U.id});
  render(`
    <div style="font-weight:800;font-size:22px;margin-bottom:18px">📈 Mi Progreso</div>
    <div class="card" style="margin-bottom:20px">
      <div style="font-weight:700;margin-bottom:14px">Registrar hoy</div>
      <div class="grid-2" style="margin-bottom:12px">
        <div><label class="lbl">Peso (kg)</label><input id="p-peso" type="number" step="0.1" placeholder="75.5"/></div>
        <div><label class="lbl">Notas</label><input id="p-notas" placeholder="Cómo me he sentido…"/></div>
      </div>
      <button class="btn" onclick="saveProgreso()">Guardar registro</button>
    </div>
    <div style="font-weight:700;font-size:15px;margin-bottom:12px">Historial (${records.length} registros)</div>
    ${records.length===0?`<div class="empty"><div class="empty-icon">📊</div><div style="font-weight:700">Sin registros aún</div></div>`:""}
    ${[...records].reverse().map(r=>`
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:14px">
        <div>
          <div style="font-weight:600">${r.fecha}</div>
          ${r.notas?`<div style="font-size:12px;color:var(--muted)">${r.notas}</div>`:""}
        </div>
        <div style="font-size:26px;font-weight:800;color:var(--accent)">${r.peso}<span style="font-size:13px;color:var(--muted)"> kg</span></div>
      </div>`).join("")}`);
}

async function saveProgreso(){
  const peso=document.getElementById("p-peso").value;
  const notas=document.getElementById("p-notas").value;
  if(!peso)return;
  await api({action:"saveProgress",clienteId:U.id,fecha:new Date().toLocaleDateString("es-ES"),peso,notas});
  renderProgreso();
}
</script>
