<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>i-Motion Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--card:#fff;--border:#e8eaed;--text:#1a1a2e;--muted:#8892a4;--accent:#4f6ef7;--success:#00c48c;--warn:#ffb648;--danger:#ff5c5c}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
button{font-family:'Inter',sans-serif;cursor:pointer}
input,select{font-family:'Inter',sans-serif}

.topbar{background:#fff;border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo{font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-0.5px}
.topbar-user{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:230px;background:#fff;border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.sidebar-item:hover{background:#f5f6fa;color:var(--text)}
.sidebar-item.active{background:#eef0ff;color:var(--accent);font-weight:600}
.sidebar-icon{font-size:16px;width:20px;text-align:center}
.sidebar-sub{font-size:10px;color:var(--muted);margin-top:1px}
.main{flex:1;padding:24px;overflow-x:hidden;min-width:0}

.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{background:#3d5ae0;box-shadow:0 4px 12px rgba(79,110,247,.3)}
.btn-sm{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:12px}
.btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;padding:8px 16px;font-weight:600;font-size:13px}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500}
.btn-ghost:hover{border-color:#aaa;color:var(--text)}
.btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #ffdddd;border-radius:8px;padding:5px 10px;font-size:12px}

input,select{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.1)}
.search-box{position:relative}
.search-box input{padding-left:36px;background:#f5f6fa;border-color:transparent}
.search-box input:focus{background:#fff;border-color:var(--accent)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
label.lbl{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}

.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
.card-hover{transition:all .15s;cursor:pointer}
.card-hover:hover{border-color:#c5cbf9;box-shadow:0 4px 16px rgba(79,110,247,.1);transform:translateY(-1px)}

.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.tag-blue{background:#eef0ff;color:#4f6ef7;border:1px solid #d5dbff}
.tag-green{background:#e6faf4;color:#00a87a;border:1px solid #b3edd8}
.tag-orange{background:#fff6e6;color:#e08a00;border:1px solid #ffd98a}
.tag-gray{background:#f0f2f5;color:#6b7280;border:1px solid #e2e5ea}
.tag-purple{background:#f3f0ff;color:#7c5cbf;border:1px solid #d4c5ff}

/* EXERCISE GRID */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ex-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .15s}
.ex-card:hover{border-color:#c5cbf9;box-shadow:0 6px 20px rgba(79,110,247,.12);transform:translateY(-2px)}
.ex-thumb{position:relative;width:100%;height:140px;background:#f5f6fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ex-thumb img{width:100%;height:100%;object-fit:cover}
.ex-thumb-placeholder{font-size:40px;color:#d0d5dd}
.ex-play{position:absolute;top:8px;right:8px;background:rgba(79,110,247,.9);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:11px}
.ex-body{padding:11px 12px}
.ex-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.3}

/* CHIPS */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:#eef0ff;border-color:var(--accent);color:var(--accent);font-weight:600}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-sm{max-width:420px}
.modal-hd{padding:22px 24px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:#fff;z-index:1;border-radius:18px 18px 0 0;border-bottom:1px solid var(--border)}
.modal-title{font-weight:800;font-size:20px}
.modal-close{background:#f5f6fa;border:none;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);flex-shrink:0}
.modal-close:hover{background:#fee;color:var(--danger)}
.modal-body{padding:20px 24px 24px}

/* EXERCISE DETAIL PANEL */
.ex-panel{background:#fff;border:1px solid var(--border);border-radius:16px;margin-top:16px;overflow:hidden}
.ex-panel-img{width:100%;height:200px;background:#f5f6fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ex-panel-img img{width:100%;height:100%;object-fit:contain;padding:16px}
.ex-panel-body{padding:16px}

.steps{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#444;line-height:1.55}
.step-num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px}

/* TRAINING VIEW */
.training-day{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden}
.training-day-hd{background:#f9fafb;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;color:var(--accent);font-size:15px}
.ex-item{padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.ex-item:last-child{border-bottom:none}
.ex-item:hover{background:#f9fafb}
.ex-item.active{background:#eef0ff}
.ex-item-top{display:flex;align-items:center;gap:12px}
.ex-item-thumb{width:54px;height:54px;border-radius:10px;background:#f0f2f5;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ex-item-thumb img{width:100%;height:100%;object-fit:cover}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat-val{font-size:28px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}

/* MACROS */
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.macro{background:#f9fafb;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.macro-val{font-size:20px;font-weight:800}
.macro-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.meal-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:flex-start}
.meal-num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

.prog-entry{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#f9fafb;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.client-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4f6ef7,#6c63ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.day-block{background:#f9fafb;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.day-hd{font-weight:700;color:var(--accent);margin-bottom:10px;font-size:14px}
.ex-row-edit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.ex-row-edit:last-of-type{border-bottom:none}

.spinner{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-sm{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f2ff 0%,#faf5ff 100%)}
.login-card{background:#fff;border-radius:20px;padding:36px;width:360px;box-shadow:0 8px 32px rgba(79,110,247,.12)}

.section-title{font-weight:800;font-size:18px;margin-bottom:18px}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#app{max-width:1100px;margin:0 auto}
.hidden{display:none!important}

/* WGER CATEGORY CHIPS */
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>

<div id="topbar" class="topbar hidden">
  <span class="logo">i-Motion</span>
  <div id="topbar-user" class="topbar-user"></div>
</div>

<div id="layout" class="layout hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div id="app"></div></main>
</div>

<div id="login-wrap" class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-1px">i-Motion</div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px;font-weight:500">EMS TRAINER PLATFORM</div>
    </div>
    <div style="margin-bottom:14px"><label class="lbl">Email</label><input id="lemail" placeholder="trainer@imotion.com" type="email"/></div>
    <div style="margin-bottom:20px"><label class="lbl">Contraseña</label><input id="lpass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div id="lerr" style="color:var(--danger);font-size:12px;margin-bottom:12px;text-align:center"></div>
    <button class="btn" style="width:100%;justify-content:center;padding:11px" id="lbtn" onclick="doLogin()">Iniciar sesión</button>
    <div style="margin-top:20px;text-align:center;font-size:11px;color:var(--muted);line-height:1.9">
      trainer@imotion.com · imotion2024<br>carlos@demo.com / maria@demo.com · 1234
    </div>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwy1JyochqSC-OvimvpHTSWedgUiZrzjeHXl79-Mbg0BlBnxcweCzI6P1ZOqH2Qo5CJWA/exec";
const WGER="https://wger.de/api/v2";
let U=null,TAB=null;
let _clients=[],_routines=[],_nutrition=[];
let _wgerCache={};

// ── API ───────────────────────────────────────────────────
async function apiGet(p){
  const r=await fetch(API+"?"+new URLSearchParams(p));
  const j=await r.json();
  if(!j.ok)throw new Error(j.error);
  return j.data;
}

async function wgerGet(endpoint){
  if(_wgerCache[endpoint])return _wgerCache[endpoint];
  const r=await fetch(WGER+endpoint);
  const j=await r.json();
  _wgerCache[endpoint]=j;
  return j;
}

async function wgerExerciseInfo(id){
  try{
    const data=await wgerGet(`/exerciseinfo/${id}/?format=json`);
    return data;
  }catch(e){return null;}
}

function render(h){document.getElementById("app").innerHTML=h;}
function spinner(t="Cargando…"){return`<div style="text-align:center;padding:60px"><div class="spinner"></div><div style="color:var(--muted);margin-top:14px;font-size:13px">${t}</div></div>`;}
function closeModal(id){document.getElementById(id)?.remove();}

// Get exercise image from wger data
function getWgerImage(exInfo){
  if(!exInfo||!exInfo.images||!exInfo.images.length)return null;
  return exInfo.images[0].image;
}

// Strip HTML tags from wger description
function stripHtml(html){
  const d=document.createElement("div");
  d.innerHTML=html||"";
  return d.textContent||d.innerText||"";
}

// ── LOCAL EXERCISE STEPS ──────────────────────────────────
const LOCAL_STEPS={
  // peso corporal
  "L1":["Coloca las manos ligeramente más anchas que los hombros","Mantén el cuerpo en línea recta de cabeza a talones","Baja el pecho hasta casi tocar el suelo","Empuja hacia arriba hasta extender los brazos"],
  "L2":["Agarra la barra con agarre prono a la anchura de hombros","Activa el core y los hombros antes de subir","Tira hasta que la barbilla supere la barra","Baja de forma lenta y controlada"],
  "L3":["Agarra las barras y eleva el cuerpo con brazos extendidos","Inclínate hacia adelante para mayor activación pectoral","Baja flexionando los codos hasta 90°","Empuja hacia arriba hasta extender los brazos"],
  "L4":["Apoya antebrazos y puntas de los pies","Mantén cuerpo en línea recta","Activa core y glúteos","Respira de forma controlada"],
  "L5":["Pies a la anchura de hombros, punteras ligeramente abiertas","Baja flexionando rodillas hasta paralelo","Mantén el pecho arriba y talones en el suelo","Sube empujando con los talones"],
  "L6":["Da un paso largo hacia adelante","Baja verticalmente hasta casi tocar el suelo con la rodilla trasera","Mantén el torso erguido","Empuja con el talón delantero para volver"],
  "L7":["De pie, baja en cuclillas y apoya las manos","Salta los pies hacia atrás a posición de plancha","Realiza una flexión (opcional)","Salta los pies hacia las manos y salta hacia arriba"],
  "L8":["Posición de plancha alta con brazos extendidos","Alterna llevando rodillas al pecho rápidamente","Mantén las caderas bajas y el core activo","Cuanto más rápido, mayor demanda cardiovascular"],
  // barra
  "B1":["Barra sobre trapecios, pies a la anchura de hombros","Inspira y baja flexionando rodillas hasta paralelo","Mantén espalda neutra y pecho arriba","Empuja con los talones espirando hasta arriba"],
  "B2":["Túmbate en el banco, agarra la barra más ancha que los hombros","Baja la barra controlando hasta el pecho","Mantén los codos a 75° respecto al torso","Empuja hacia arriba espirando"],
  "B3":["Ajusta el banco a 30-45°","Baja la barra hasta la parte alta del pecho","Mantén los pies firmes y espalda baja apoyada","Empuja hacia arriba y ligeramente hacia atrás"],
  "B4":["De pie frente a la barra, pies a la anchura de caderas","Agarra la barra justo fuera de las piernas, espalda neutra","Empuja el suelo extendiendo caderas y rodillas","Baja de forma controlada invirtiendo el movimiento"],
  "B5":["De pie con la barra, agarre prono","Empuja las caderas hacia atrás, espalda neutra","Baja hasta sentir tensión en los isquios","Vuelve empujando caderas hacia adelante"],
  "B6":["Inclínate 45-60° con espalda neutra","Agarra la barra a la anchura de hombros","Tira hacia el ombligo retrayendo omóplatos","Baja de forma controlada"],
  "B7":["De pie o sentado con la barra a la barbilla","Empuja hacia arriba hasta casi extender los brazos","Baja de forma controlada","Mantén el core activo"],
  "B8":["Agarra la barra con agarre supino","Mantén los codos pegados a los costados","Flexiona los codos llevando la barra al pecho","Baja de forma lenta y controlada"],
  // mancuernas
  "M1":["Sentado con mancuernas a la altura del hombro, palmas hacia ti","Gira las muñecas al subir hasta palmas hacia adelante","Extiende los brazos hacia arriba","Invierte el giro al bajar"],
  "M2":["De pie, mancuernas a los lados, codos ligeramente flexionados","Eleva los brazos lateralmente hasta la altura de hombros","Los codos lideran el movimiento","Baja de forma lenta y controlada"],
  "M3":["De pie, mancuernas con agarre supino","Alterna la flexión girando la muñeca al subir","Lleva la mancuerna hasta el hombro","Baja de forma controlada y repite"],
  "M4":["De pie, mancuernas con agarre neutro (palmas enfrentadas)","Flexiona los codos manteniendo el agarre","Sube hasta el nivel del hombro","Baja de forma controlada"],
  "M5":["Inclínate con caderas flexionadas y espalda neutra","Mancuernas con codos ligeramente flexionados","Eleva los brazos lateralmente hasta hombros","Aprieta deltoides posteriores en la cima"],
  "M6":["Túmbate en el banco, mancuernas con brazos extendidos","Abre los brazos describiendo un arco amplio","Mantén un ligero codo doblado","Cierra los brazos apretando el pecho"],
  "M7":["Apoya la espalda alta en un banco","Coloca la mancuerna sobre las caderas","Empuja con los talones elevando las caderas","Aprieta glúteos en la parte alta"],
  "M8":["Apoya mano y rodilla del mismo lado en un banco","Agarra la mancuerna con el brazo extendido","Tira hacia la cadera retrayendo el omóplato","Baja de forma controlada"],
  // máquina
  "MA1":["Siéntate con la espalda bien apoyada","Pies en la plataforma a la anchura de hombros","Flexiona hasta 90°","Empuja con los talones hasta casi extender"],
  "MA2":["Túmbate boca abajo en la máquina","Rodillo justo por encima de los talones","Flexiona las rodillas llevando talones a glúteos","Controla la bajada lentamente"],
  "MA3":["Coloca los hombros bajo los apoyos","Sube de puntillas lo más alto posible","Mantén 1 segundo en la cima","Baja lentamente hasta estirar el gemelo"],
  "MA4":["Siéntate con los muslos bajo los rodillos","Agarra la barra con agarre prono ancho","Tira hacia el pecho llevando los codos hacia abajo","Controla la subida"],
  // cable
  "C1":["Siéntate con pies en los apoyos","Agarra el cable con brazos extendidos y espalda erguida","Tira hacia el abdomen llevando codos hacia atrás","Extiende los brazos de forma controlada"],
  "C2":["Ajusta la polea a la altura de los ojos","Agarra la cuerda con palmas hacia abajo","Tira hacia tu cara separando los extremos","Mantén los codos elevados"],
  "C3":["Agarra el cable con codos pegados al cuerpo","Desde 90° de flexión extiende hacia abajo","Aprieta tríceps en la posición extendida","Sube de forma controlada"],
  "C4":["Agarra la barra de la polea baja","Mantén los codos pegados al cuerpo","Flexiona los codos llevando la barra al pecho","Baja de forma lenta"],
  "C5":["De pie entre las dos poleas ajustadas arriba","Agarra un cable con cada mano","Lleva los brazos hacia adelante y abajo cruzándolos","Controla la vuelta a la posición inicial"],
  // banda
  "BE1":["Coloca la banda bajo los pies y sobre los hombros","Pies a la anchura de hombros","Baja flexionando rodillas hasta paralelo","Sube empujando contra la resistencia"],
  "BE2":["Pisa la banda con ambos pies","Agarra los extremos con agarre supino","Flexiona los codos contra la resistencia","Baja de forma lenta y controlada"],
  "BE3":["Pisa la banda y agarra los extremos a la altura de hombros","Empuja hacia arriba extendiendo los brazos","Controla la bajada resistiendo la tensión","Mantén el core activo"],
  "BE4":["A cuatro patas, banda en los pies","Extiende una pierna hacia atrás y arriba","Aprieta el glúteo en la posición extendida","Baja de forma controlada"],
  "BE5":["Coloca la banda por encima de las rodillas","De pie o tumbado de lado","Separa las piernas contra la resistencia","Controla la vuelta"],
  "BE6":["Ancla la banda a una altura media","Agarra los extremos con brazos extendidos","Tira hacia el abdomen retrayendo los omóplatos","Extiende los brazos de forma controlada"],
  // trx
  "T1":["Agarra las asas con brazos extendidos, cuerpo inclinado","Mantén el cuerpo en línea recta","Tira hacia el pecho retrayendo los omóplatos","Baja de forma controlada"],
  "T2":["Agarra las asas con brazos extendidos hacia adelante","Mantén el cuerpo en línea recta","Baja flexionando los codos","Empuja hacia arriba extendiendo los brazos"],
  "T3":["Agarra las asas frente a ti para equilibrio","Pies a la anchura de hombros","Baja como en una sentadilla normal","Sube empujando con los talones"],

function resolveExId(id){
  const s=String(id);
  // Si ya es un ID local (empieza por letra) devuélvelo tal cual
  if(isNaN(s[0]))return s;
  // Si es numérico, busca en el mapa
  return ID_MAP[s]||null;
}

// Wger image cache
const wgerImgCache={};
async function loadWgerImage(ex){
  if(!ex.wger)return null;
  if(wgerImgCache[ex.id])return wgerImgCache[ex.id];
  try{
    const d=await wgerGet(`/exerciseimage/?exercise=${ex.wger}&format=json`);
    const img=d.results&&d.results.length?d.results[0].image:null;
    wgerImgCache[ex.id]=img;
    return img;
  }catch(e){return null;}
}

// ── LOGIN ─────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById("lemail").value.trim();
  const pass=document.getElementById("lpass").value;
  const btn=document.getElementById("lbtn");
  const errEl=document.getElementById("lerr");
  if(!email||!pass)return;
  btn.disabled=true;btn.textContent="Verificando…";errEl.textContent="";
  try{
    const user=await apiGet({action:"login",email,password:pass});
    U=user;TAB=user.rol==="trainer"?"clientes":"entrenamiento";
    document.getElementById("login-wrap").classList.add("hidden");
    document.getElementById("topbar").classList.remove("hidden");
    document.getElementById("layout").classList.remove("hidden");
    renderTopbar();renderSidebar();renderTab();
  }catch(e){
    errEl.textContent=e.message;btn.disabled=false;btn.textContent="Iniciar sesión";
  }
}

function logout(){
  U=null;TAB=null;
  document.getElementById("login-wrap").classList.remove("hidden");
  document.getElementById("topbar").classList.add("hidden");
  document.getElementById("layout").classList.add("hidden");
}

function renderTopbar(){
  document.getElementById("topbar-user").innerHTML=`
    <span style="font-size:12px;color:var(--muted)">${U.nombre}</span>
    <div class="avatar">${U.nombre[0]}</div>
    <button class="btn-ghost" onclick="logout()">Salir</button>`;
}

function renderSidebar(){
  const items=U.rol==="trainer"?[
    {id:"clientes",icon:"👥",label:"Clientes",sub:"Gestiona tus clientes"},
    {id:"biblioteca",icon:"📚",label:"Ejercicios",sub:"Biblioteca completa"},
    {id:"rutinas",icon:"⚡",label:"Rutinas",sub:"Crea y asigna rutinas"},
    {id:"nutricion",icon:"🥗",label:"Nutrición",sub:"Planes nutricionales"},
  ]:[
    {id:"entrenamiento",icon:"💪",label:"Mi Entrenamiento",sub:"Tu rutina de hoy"},
    {id:"nutricion_c",icon:"🥗",label:"Mi Nutrición",sub:"Tu plan alimenticio"},
    {id:"progreso",icon:"📈",label:"Mi Progreso",sub:"Evolución y registros"},
  ];
  document.getElementById("sidebar").innerHTML=`
    <div style="padding:8px 4px 14px;border-bottom:1px solid var(--border);margin-bottom:10px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:0 12px">Menú</div>
    </div>
    ${items.map(it=>`
      <button class="sidebar-item${TAB===it.id?' active':''}" onclick="setTab('${it.id}')">
        <span class="sidebar-icon">${it.icon}</span>
        <div><div>${it.label}</div><div class="sidebar-sub">${it.sub}</div></div>
      </button>`).join("")}`;
}

function setTab(t){TAB=t;renderSidebar();renderTab();}
function renderTab(){
  if(U.rol==="trainer"){
    if(TAB==="clientes")renderClients();
    else if(TAB==="biblioteca")renderLibrary();
    else if(TAB==="rutinas")renderRoutines();
    else if(TAB==="nutricion")renderNutrition();
  }else{
    if(TAB==="entrenamiento")renderClientTraining();
    else if(TAB==="biblioteca")renderLibrary();
    else if(TAB==="nutricion_c")renderClientNutrition();
    else if(TAB==="progreso")renderClientProgress();
  }
}

      ${filtered.map(e=>`
        <div class="ex-card" onclick="openExModal('${e.id}')" id="excard-${e.id}">
          <div class="ex-thumb" id="thumb-${e.id}">
            <div class="ex-thumb-placeholder">🏋️</div>

          </div>

            <div class="ex-name">${e.nombre}</div>
            <div style="display:flex;gap:4px;flex-wrap:wrap">
              <span class="tag tag-blue">${e.equipo}</span>
              <span class="tag tag-gray">${e.musculo}</span>
            </div>
          </div>
        </div>`).join("")}
    </div>`);
  // Load wger images async
  filtered.forEach(e=>{if(e.wger)loadAndSetThumb(e);});
}

async function loadAndSetThumb(ex){
  const img=await loadWgerImage(ex);
  if(!img)return;
  const el=document.getElementById(`thumb-${ex.id}`);
  if(!el)return;
  el.innerHTML=`<img src="${img}" alt="${ex.nombre}" loading="lazy"/><div class="ex-play">▶</div>`;
}

async function openExModal(id){
  const ex=EXDB.find(e=>e.id===id);
  if(!ex)return;
  const steps=LOCAL_STEPS[id]||[];
  // Get wger image
  const img=await loadWgerImage(ex);

  document.body.insertAdjacentHTML("beforeend",`
    <div class="modal-bg" id="exmodal" onclick="if(event.target===this)closeModal('exmodal')">
      <div class="modal">
        <div class="modal-hd">
          <div>
            <div class="modal-title">${ex.nombre}</div>
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
              <span class="tag tag-blue">${ex.equipo}</span>
              <span class="tag tag-gray">${ex.musculo}</span>
              <span class="tag tag-green">${ex.nivel}</span>
            </div>
          </div>
          <button class="modal-close" onclick="closeModal('exmodal')">✕</button>
        </div>
        <div class="modal-body">
          ${ex.video?`
            <div style="position:relative;padding-bottom:56.25%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:20px">
              <iframe src="${ex.video}?rel=0&modestbranding=1" style="position:absolute;inset:0;width:100%;height:100%;border:none" allowfullscreen></iframe>
            </div>`:""}
          ${img?`
            <div style="background:#f5f6fa;border-radius:12px;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center">
              <img src="${img}" alt="${ex.nombre}" style="max-width:100%;max-height:200px;object-fit:contain;padding:12px"/>
            </div>`:`${!ex.video?'<div style="background:#f5f6fa;border-radius:12px;padding:40px;text-align:center;margin-bottom:20px;font-size:48px">🏋️</div>':''}`}
          ${steps.length?`
            <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Cómo realizarlo</div>
            <ol class="steps">
              ${steps.map((s,i)=>`<li><div class="step-num">${i+1}</div><span>${s}</span></li>`).join("")}
            </ol>`:""}
          ${ex.wger?`<div style="margin-top:16px;font-size:11px;color:var(--muted)">Fuente: wger.de · CC-BY-SA</div>`:""}
        </div>
      </div>
    </div>`);
}

function switchClientTab(tabId){
  ["tab-rutina","tab-nutri","tab-msg"].forEach(t=>{
    const btn=document.getElementById(t);
    const content=document.getElementById(t+"-content");
    if(t===tabId){
      btn.style.borderBottomColor="var(--accent)";
      btn.style.color="var(--accent)";
      btn.style.fontWeight="700";
      content?.classList.remove("hidden");
    }else{
      btn.style.borderBottomColor="transparent";
      btn.style.color="var(--muted)";
      btn.style.fontWeight="500";
      content?.classList.add("hidden");
    }
  });
}

                <div class="ex-item-thumb" id="mini-thumb-${di}-${ei}">
                  <span style="font-size:20px">🏋️</span>

function markDone(cb,nameId){
  const el=document.getElementById(nameId);
  if(el){el.style.textDecoration=cb.checked?"line-through":"none";el.style.color=cb.checked?"var(--muted)":"var(--text)";}
}

async function toggleExDetail(exId,key){
  const detailEl=document.getElementById(`exdetail-${key}`);
  const arrowEl=document.getElementById(`arrow-${key}`);
  const itemEl=document.getElementById(`exitem-${key}`);
  if(!detailEl)return;

  if(!detailEl.classList.contains("hidden")){
    detailEl.classList.add("hidden");
    arrowEl.textContent="›";
    itemEl.classList.remove("active");
    return;
  }

  // Show loading
  detailEl.innerHTML=`<div style="padding:16px;text-align:center"><div class="loading-sm"></div></div>`;
  detailEl.classList.remove("hidden");
  arrowEl.textContent="⌄";
  itemEl.classList.add("active");

        const resolvedId=resolveExId(exId);
      const exLocal=resolvedId?EXDB.find(e=>e.id===resolvedId):null;
  const steps=LOCAL_STEPS[exId]||[];
  const img=exLocal?await loadWgerImage(exLocal):null;

  detailEl.innerHTML=`
    <div style="padding:16px;border-top:1px solid var(--border)">
      ${exLocal?.video?`
        <div style="position:relative;padding-bottom:56.25%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px">
          <iframe src="${exLocal.video}?rel=0&modestbranding=1" style="position:absolute;inset:0;width:100%;height:100%;border:none" allowfullscreen></iframe>
        </div>`:""}
      ${img?`
        <div style="background:#f5f6fa;border-radius:10px;overflow:hidden;margin-bottom:14px;display:flex;align-items:center;justify-content:center">
          <img src="${img}" alt="${exLocal?.nombre||''}" style="max-width:100%;max-height:160px;object-fit:contain;padding:10px"/>
        </div>`:""}
      ${steps.length?`
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Cómo realizarlo</div>
        <ol class="steps">
          ${steps.map((s,i)=>`<li><div class="step-num">${i+1}</div><span>${s}</span></li>`).join("")}
        </ol>`:`<div style="color:var(--muted);font-size:13px">Pregunta a tu entrenador por la técnica correcta.</div>`}
    </div>`;
}

// ── CLIENTE: MI NUTRICIÓN ─────────────────────────────────
async function renderClientNutrition(){
  render(spinner("Cargando…"));
  const plans=await apiGet({action:"nutrition",clientId:U.id});
  if(!plans[0]){render(`<div style="padding:60px;text-align:center;color:var(--muted)"><div style="font-size:40px;margin-bottom:12px">🥗</div><div style="font-weight:600">Sin plan asignado</div></div>`);return;}
  render(`<div class="section-title">Mi Plan Nutricional</div><div class="card">${nutriCard(plans[0])}</div>`);
}

// ── CLIENTE: MI PROGRESO ──────────────────────────────────
async function renderClientProgress(){
  render(spinner("Cargando…"));
  const records=await apiGet({action:"progress",clientId:U.id});
  render(`
    <div class="section-title">Mi Progreso</div>
    <div class="card" style="margin-bottom:20px">
      <div style="font-weight:700;margin-bottom:14px">Registrar hoy</div>
      <div class="grid-2" style="margin-bottom:12px">
        <div><label class="lbl">Peso (kg)</label><input id="ppeso" type="number" step="0.1" placeholder="75.5"/></div>
        <div><label class="lbl">Notas</label><input id="pnotas" placeholder="Cómo me he sentido…"/></div>
      </div>
      <button class="btn" onclick="saveProgress()">Guardar</button>
    </div>
    <div style="font-weight:700;font-size:15px;margin-bottom:12px">Historial (${records.length})</div>
    ${[...records].reverse().map(r=>`
      <div class="prog-entry">
        <div><div style="font-weight:600">${r.fecha}</div>${r.notas?`<div style="font-size:12px;color:var(--muted)">${r.notas}</div>`:""}</div>
        <div style="font-size:26px;font-weight:800;color:var(--accent)">${r.peso}<span style="font-size:13px;color:var(--muted)"> kg</span></div>
      </div>`).join("")}`);
}

async function saveProgress(){
  const peso=document.getElementById("ppeso").value;
  const notas=document.getElementById("pnotas").value;
  if(!peso)return;
  await apiGet({action:"saveProgress",clienteId:U.id,fecha:new Date().toLocaleDateString("es-ES"),peso,notas});
  renderClientProgress();
}
</script>
