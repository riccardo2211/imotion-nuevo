<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>i-Motion Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6fa;--sidebar:#fff;--card:#fff;--border:#e8eaed;
  --text:#1a1a2e;--muted:#8892a4;--accent:#4f6ef7;--accent2:#6c63ff;
  --success:#00c48c;--warn:#ffb648;--danger:#ff5c5c;
  --tag-bg:#eef0ff;--tag-color:#4f6ef7;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
button{font-family:'Inter',sans-serif;cursor:pointer}
input,select,textarea{font-family:'Inter',sans-serif}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.logo{font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-0.5px;margin-right:8px}
.topbar-nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.topbar-btn{background:none;border:none;color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s}
.topbar-btn:hover{background:#f0f2ff;color:var(--accent)}
.topbar-btn.active{background:#eef0ff;color:var(--accent);font-weight:600}
.topbar-user{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:240px;background:#fff;border-right:1px solid var(--border);padding:16px 12px;flex-shrink:0}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px;transition:all .15s;margin-bottom:4px;border:none;background:none;width:100%;text-align:left}
.sidebar-item:hover{background:#f5f6fa;color:var(--text)}
.sidebar-item.active{background:#eef0ff;color:var(--accent);font-weight:600}
.sidebar-icon{font-size:16px;width:20px;text-align:center}
.sidebar-sub{font-size:11px;color:var(--muted);margin-top:1px;font-weight:400}
.main{flex:1;padding:24px;overflow-x:hidden}

/* BUTTONS */
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-weight:600;font-size:13px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#3d5ae0;transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,110,247,.3)}
.btn-sm{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:12px}
.btn-outline{background:#fff;color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;padding:8px 16px;font-weight:600;font-size:13px}
.btn-outline:hover{background:#eef0ff}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500}
.btn-ghost:hover{border-color:#aaa;color:var(--text)}
.btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #ffdddd;border-radius:8px;padding:5px 10px;font-size:12px}

/* INPUTS */
input,select{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.1)}
.search-box{position:relative}
.search-box input{padding-left:36px;background:#f5f6fa;border-color:transparent}
.search-box input:focus{background:#fff;border-color:var(--accent)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
label.lbl{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}

/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-hover{transition:all .15s;cursor:pointer}
.card-hover:hover{border-color:#c5cbf9;box-shadow:0 4px 16px rgba(79,110,247,.1);transform:translateY(-1px)}

/* TAGS */
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.tag-blue{background:#eef0ff;color:#4f6ef7;border:1px solid #d5dbff}
.tag-green{background:#e6faf4;color:#00a87a;border:1px solid #b3edd8}
.tag-orange{background:#fff6e6;color:#e08a00;border:1px solid #ffd98a}
.tag-purple{background:#f3f0ff;color:#7c5cbf;border:1px solid #d4c5ff}
.tag-gray{background:#f0f2f5;color:#6b7280;border:1px solid #e2e5ea}
.tag-red{background:#fff0f0;color:#e53e3e;border:1px solid #ffcccc}

/* EXERCISE GRID — Harbiz style */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ex-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .15s}
.ex-card:hover{border-color:#c5cbf9;box-shadow:0 6px 20px rgba(79,110,247,.12);transform:translateY(-2px)}
.ex-thumb{position:relative;width:100%;padding-bottom:62%;background:#f0f2f5;overflow:hidden}
.ex-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex-thumb-dark{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,rgba(0,0,0,.1) 50%,transparent 100%)}
.ex-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ex-tags-overlay{position:absolute;bottom:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:3px}
.ex-body{padding:11px 12px}
.ex-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.3}
.ex-meta{display:flex;flex-wrap:wrap;gap:3px}

/* FILTER CHIPS */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:#eef0ff;border-color:var(--accent);color:var(--accent);font-weight:600}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-sm{max-width:420px}
.modal-hd{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:#fff;z-index:1;border-radius:18px 18px 0 0}
.modal-title{font-weight:800;font-size:20px}
.modal-close{background:#f5f6fa;border:none;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);flex-shrink:0;transition:all .15s}
.modal-close:hover{background:#fee;color:var(--danger)}
.modal-video{position:relative;padding-bottom:56.25%;background:#000}
.modal-video iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.modal-body{padding:20px 24px 24px}

/* STEPS */
.steps{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#444;line-height:1.55}
.step-num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat-val{font-size:28px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}

/* ROUTINE */
.day-block{background:#f9fafb;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.day-hd{font-weight:700;color:var(--accent);margin-bottom:10px;font-size:14px;display:flex;align-items:center;gap:6px}
.ex-row-edit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.ex-row-edit:last-of-type{border-bottom:none}

/* MACROS */
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.macro{background:#f9fafb;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.macro-val{font-size:20px;font-weight:800}
.macro-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.meal-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:flex-start}
.meal-num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}

/* PROGRESS */
.prog-entry{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#f9fafb;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}

/* CLIENT CARD */
.client-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;transition:all .15s}
.client-card:hover{border-color:#c5cbf9;box-shadow:0 4px 16px rgba(79,110,247,.1)}
.client-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4f6ef7,#6c63ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}

/* SPINNER */
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0f2ff 0%,#faf5ff 100%)}
.login-card{background:#fff;border-radius:20px;padding:36px;width:360px;box-shadow:0 8px 32px rgba(79,110,247,.12)}

.section-title{font-weight:800;font-size:18px;margin-bottom:18px}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
#app{max-width:1100px;margin:0 auto}
.hidden{display:none!important}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar" class="topbar hidden">
  <span class="logo">i-Motion</span>
  <nav class="topbar-nav" id="topbar-nav"></nav>
  <div class="topbar-user" id="topbar-user"></div>
</div>

<!-- LAYOUT -->
<div id="layout" class="layout hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div id="app"></div></main>
</div>

<!-- LOGIN (shown initially) -->
<div id="login-wrap" class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-1px">i-Motion</div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px;font-weight:500">EMS TRAINER PLATFORM</div>
    </div>
    <div style="margin-bottom:14px">
      <label class="lbl">Email</label>
      <input id="lemail" placeholder="trainer@imotion.com" type="email"/>
    </div>
    <div style="margin-bottom:20px">
      <label class="lbl">Contraseña</label>
      <input id="lpass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div id="lerr" style="color:var(--danger);font-size:12px;margin-bottom:12px;text-align:center"></div>
    <button class="btn" style="width:100%;justify-content:center;padding:11px" id="lbtn" onclick="doLogin()">Iniciar sesión</button>
    <div style="margin-top:20px;text-align:center;font-size:11px;color:var(--muted);line-height:1.9">
      trainer@imotion.com · imotion2024<br>carlos@demo.com / maria@demo.com · 1234
    </div>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwy1JyochqSC-OvimvpHTSWedgUiZrzjeHXl79-Mbg0BlBnxcweCzI6P1ZOqH2Qo5CJWA/exec";
let U=null,TAB=null,STAB=null;
let _ex=null,_clients=[],_routines=[],_nutrition=[];

async function apiGet(p){
  const r=await fetch(API+"?"+new URLSearchParams(p));
  const j=await r.json();
  if(!j.ok)throw new Error(j.error);
  return j.data;
}

function render(h){document.getElementById("app").innerHTML=h;}
function ytThumb(url){const m=url.match(/embed\/([^?]+)/);return m?`https://img.youtube.com/vi/${m[1]}/mqdefault.jpg`:"";}
function spinner(t="Cargando…"){return`<div style="text-align:center;padding:60px"><div class="spinner"></div><div style="color:var(--muted);margin-top:14px;font-size:13px">${t}</div></div>`;}
function closeModal(id){document.getElementById(id)?.remove();}

// ── EXERCISE DATA ─────────────────────────────────────────

  {id:"L1",nombre:"Flexiones",musculo:"Pecho",equipo:"Peso corporal",video:"https://www.youtube.com/embed/IODxDxX7oi4",nivel:"Principiante",tipo:"Compuesto",steps:["Coloca las manos ligeramente más anchas que los hombros","Mantén el cuerpo en línea recta de cabeza a talones","Baja el pecho hasta casi tocar el suelo","Empuja hacia arriba hasta extender los brazos"]},
  {id:"L2",nombre:"Dominadas",musculo:"Espalda",equipo:"Peso corporal",video:"https://www.youtube.com/embed/eGo4IYlbE5g",nivel:"Intermedio",tipo:"Compuesto",steps:["Agarra la barra con agarre prono a la anchura de hombros","Activa el core y los hombros antes de subir","Tira hacia arriba hasta que la barbilla supere la barra","Baja de forma lenta y controlada"]},
  {id:"L3",nombre:"Fondos en paralelas",musculo:"Pecho / Tríceps",equipo:"Peso corporal",video:"https://www.youtube.com/embed/wjUmnZH528Y",nivel:"Intermedio",tipo:"Compuesto",steps:["Agarra las barras y eleva el cuerpo con brazos extendidos","Inclínate hacia adelante para mayor activación pectoral","Baja flexionando los codos hasta 90°","Empuja hacia arriba hasta extender los brazos"]},

  {id:"L5",nombre:"Sentadilla con peso corporal",musculo:"Cuádriceps",equipo:"Peso corporal",video:"https://www.youtube.com/embed/aclHkVaku9U",nivel:"Principiante",tipo:"Compuesto",steps:["Pies a la anchura de hombros, punteras ligeramente abiertas","Baja flexionando rodillas hasta paralelo","Mantén el pecho arriba y talones en el suelo","Sube empujando con los talones"]},

// ── LOGIN ─────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById("lemail").value.trim();
  const pass=document.getElementById("lpass").value;
  const btn=document.getElementById("lbtn");
  const errEl=document.getElementById("lerr");
  if(!email||!pass)return;
  btn.disabled=true;btn.textContent="Verificando…";errEl.textContent="";
  try{
    const user=await apiGet({action:"login",email,password:pass});
    U=user;
    TAB=user.rol==="trainer"?"clientes":"entrenamiento";
    document.getElementById("login-wrap").classList.add("hidden");
    document.getElementById("topbar").classList.remove("hidden");
    document.getElementById("layout").classList.remove("hidden");
    renderTopbar();renderSidebar();renderTab();
  }catch(e){
    errEl.textContent=e.message;
    btn.disabled=false;btn.textContent="Iniciar sesión";
  }
}

function logout(){
  U=null;TAB=null;_ex=null;
  document.getElementById("login-wrap").classList.remove("hidden");
  document.getElementById("topbar").classList.add("hidden");
  document.getElementById("layout").classList.add("hidden");
}

// ── TOPBAR ────────────────────────────────────────────────
function renderTopbar(){
  document.getElementById("topbar-user").innerHTML=`
    <span style="font-size:12px;color:var(--muted)">${U.nombre}</span>
    <div class="avatar">${U.nombre[0]}</div>
    <button class="btn-ghost" onclick="logout()">Salir</button>`;
}

// ── SIDEBAR ───────────────────────────────────────────────
function renderSidebar(){
  const items=U.rol==="trainer"?[
    {id:"clientes",icon:"👥",label:"Clientes",sub:"Gestiona tus clientes"},
    {id:"biblioteca",icon:"📚",label:"Librería",sub:"Ejercicios y rutinas"},
    {id:"rutinas",icon:"⚡",label:"Rutinas",sub:"Crea y asigna rutinas"},
    {id:"nutricion",icon:"🥗",label:"Nutrición",sub:"Planes nutricionales"},
    {id:"agenda",icon:"📅",label:"Agenda",sub:"Próximas sesiones"},
  ]:[
    {id:"entrenamiento",icon:"💪",label:"Mi Entrenamiento",sub:"Tu rutina de hoy"},
    {id:"biblioteca",icon:"📚",label:"Ejercicios",sub:"Biblioteca completa"},
    {id:"nutricion_c",icon:"🥗",label:"Mi Nutrición",sub:"Tu plan alimenticio"},
    {id:"progreso",icon:"📈",label:"Mi Progreso",sub:"Evolución y registros"},
  ];
  document.getElementById("sidebar").innerHTML=`
    <div style="padding:8px 4px 16px;border-bottom:1px solid var(--border);margin-bottom:12px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:0 12px">Menú</div>
    </div>
    ${items.map(it=>`
      <button class="sidebar-item${TAB===it.id?' active':''}" onclick="setTab('${it.id}')">
        <span class="sidebar-icon">${it.icon}</span>
        <div>
          <div>${it.label}</div>
          <div class="sidebar-sub">${it.sub}</div>
        </div>
      </button>`).join("")}`;
}

function setTab(t){TAB=t;renderSidebar();renderTab();}

function renderTab(){
  if(U.rol==="trainer"){
    if(TAB==="clientes")renderClients();
    else if(TAB==="biblioteca")renderLibrary();
    else if(TAB==="rutinas")renderRoutines();
    else if(TAB==="nutricion")renderNutrition();
    else if(TAB==="agenda")renderAgenda();
  }else{
    if(TAB==="entrenamiento")renderClientTraining();
    else if(TAB==="biblioteca")renderLibrary();
    else if(TAB==="nutricion_c")renderClientNutrition();
    else if(TAB==="progreso")renderClientProgress();
  }
}

async function openRoutineEditor(routineId){
  const routine=_routines.find(r=>String(r.id)===String(routineId));
  const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const avail=DAYS.filter(d=>!(routine.days||[]).find(x=>x.dia===d));
  const exOpts=EQUIPMENT.filter(e=>e!=="Todo").map(eq=>`<optgroup label="${eq}">${EXERCISES_LOCAL.filter(e=>e.equipo===eq).map(e=>`<option value="${e.id}">${e.nombre}</option>`).join("")}</optgroup>`).join("");

  document.body.insertAdjacentHTML("beforeend",`
    <div class="modal-bg" id="re" style="align-items:flex-start;padding:20px;overflow-y:auto">
      <div class="modal" style="max-width:660px;width:100%;margin:0 auto">
        <div class="modal-hd">
          <div class="modal-title">${routine.nombre}</div>
          <button class="modal-close" onclick="closeModal('re');renderRoutines()">✕</button>
        </div>
        <div class="modal-body">
          <div class="flex" style="margin-bottom:20px;gap:10px">
            <select id="newday" style="flex:1">
              <option value="">+ Seleccionar día…</option>
              ${avail.map(d=>`<option>${d}</option>`).join("")}
            </select>
            <button class="btn" onclick="addDayR('${routine.id}')">Añadir día</button>
          </div>
          <div id="days-c">
            ${(routine.days||[]).map(d=>`
              <div class="day-block" id="day-${d.id}">
                <div class="day-hd">📅 ${d.dia}</div>
                <div id="exlist-${d.id}">
                  ${(d.exercises||[]).map(ex=>{
                    const exData=EXERCISES_LOCAL.find(e=>String(e.id)===String(ex.exerciseId));
                    return `<div class="ex-row-edit" id="exrow-${ex.id}">
                      <div style="flex:1">
                        <div style="font-weight:600;font-size:13px">${exData?.nombre||ex.exerciseId}</div>
                        <div style="font-size:11px;color:var(--muted)">${ex.series} series × ${ex.reps} · Descanso ${ex.descanso}</div>
                      </div>
                      <button class="btn-danger" onclick="removeExR('${ex.id}','${d.id}')">✕</button>
                    </div>`;
                  }).join("")}
                </div>
                <select style="margin-top:10px;font-size:12px" onchange="addExR('${d.id}',this.value);this.value=''">
                  <option value="">+ Añadir ejercicio…</option>
                  ${exOpts}
                </select>
              </div>`).join("")}
          </div>
        </div>
      </div>
    </div>`);
}

async function addDayR(routineId){
  const dia=document.getElementById("newday").value;if(!dia)return;
  await apiGet({action:"addDay",routineId,dia});
  closeModal("re");_routines=await apiGet({action:"routines"});openRoutineEditor(routineId);
}

async function addExR(dayId,exId){
  if(!exId)return;
  const{id}=await apiGet({action:"addExercise",dayId,exerciseId:exId,series:3,reps:"10",descanso:"60s"});
  const ex=EXERCISES_LOCAL.find(e=>e.id===exId);
  document.getElementById(`exlist-${dayId}`)?.insertAdjacentHTML("beforeend",`
    <div class="ex-row-edit" id="exrow-${id}">
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px">${ex?.nombre||exId}</div>
        <div style="font-size:11px;color:var(--muted)">3 series × 10 · Descanso 60s</div>
      </div>
      <button class="btn-danger" onclick="removeExR('${id}','${dayId}')">✕</button>
    </div>`);
}

async function removeExR(exId,dayId){
  await apiGet({action:"removeExercise",id:exId});
  document.getElementById(`exrow-${exId}`)?.remove();
}

    </div>
    ${meals.map((m,i)=>`<div class="meal-row"><div class="meal-num">${i+1}</div><span>${m}</span></div>`).join("")}`;
}

      <button class="btn" onclick="saveProgress()">Guardar registro</button>
    </div>
    <div style="font-weight:700;font-size:15px;margin-bottom:12px">Historial (${records.length} registros)</div>
    ${records.length===0?`<div style="color:var(--muted);font-size:13px">Aún no hay registros.</div>`:""}
    ${[...records].reverse().map(r=>`
      <div class="prog-entry">
        <div>
          <div style="font-weight:600">${r.fecha}</div>
          ${r.notas?`<div style="font-size:12px;color:var(--muted)">${r.notas}</div>`:""}
        </div>
        <div style="font-size:26px;font-weight:800;color:var(--accent)">${r.peso}<span style="font-size:13px;color:var(--muted)"> kg</span></div>
      </div>`).join("")}`);
}

async function saveProgress(){
  const peso=document.getElementById("ppeso").value;
  const notas=document.getElementById("pnotas").value;
  if(!peso)return;
  await apiGet({action:"saveProgress",clienteId:U.id,fecha:new Date().toLocaleDateString("es-ES"),peso,notas});
  renderClientProgress();
}
</script>
</body>
</html>
