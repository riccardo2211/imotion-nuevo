<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>i-Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6fa;--white:#fff;--border:#e8eaed;
  --text:#1a1a2e;--muted:#8892a4;
  --accent:#4f6ef7;--success:#00c48c;--warn:#ffb648;--danger:#ff5c5c;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
button,input,select,textarea{font-family:'Inter',sans-serif}

/* ── TOPBAR ── */
.topbar{background:var(--white);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.logo{font-weight:800;font-size:17px;color:var(--accent);letter-spacing:-.5px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

/* ── LAYOUT ── */
.layout{display:flex;min-height:calc(100vh - 54px)}
.sidebar{width:220px;background:var(--white);border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0}
.sidebar-section{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:0 10px;margin:14px 0 6px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.sidebar-item:hover{background:#f0f2ff;color:var(--text)}
.sidebar-item.active{background:#eef0ff;color:var(--accent);font-weight:600}
.sidebar-icon{font-size:16px;width:22px;text-align:center}
.main{flex:1;padding:24px;overflow-x:hidden}
#app{max-width:960px;margin:0 auto}

/* ── BUTTONS ── */
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{background:#3d5ae0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:5px 12px;font-weight:600;font-size:12px;cursor:pointer}
.btn-outline{background:var(--white);color:var(--accent);border:1.5px solid var(--accent);border-radius:9px;padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.btn-ghost:hover{border-color:#aaa;color:var(--text)}
.btn-danger{background:#fff0f0;color:var(--danger);border:1px solid #ffdddd;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer}

/* ── INPUTS ── */
input,select,textarea{background:var(--white);border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.1)}
label.lbl{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:18px}
.card-hover:hover{border-color:#c5cbf9;box-shadow:0 4px 16px rgba(79,110,247,.1);transform:translateY(-1px);cursor:pointer}
.card-hover{transition:all .15s}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600}
.tag-blue{background:#eef0ff;color:#4f6ef7;border:1px solid #d5dbff}
.tag-green{background:#e6faf4;color:#00a87a;border:1px solid #b3edd8}
.tag-orange{background:#fff6e6;color:#e08a00;border:1px solid #ffd98a}
.tag-red{background:#fff0f0;color:#e53e3e;border:1px solid #ffcccc}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--white);border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-sm{max-width:420px}
.modal-hd{padding:20px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);z-index:1;border-radius:16px 16px 0 0}
.modal-title{font-weight:800;font-size:18px}
.modal-close{background:#f5f6fa;border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#fee;color:var(--danger)}
.modal-body{padding:20px 22px 24px}

/* ── VIDEO ── */
.video-thumb{position:relative;border-radius:10px;overflow:hidden;background:#000;cursor:pointer}
.video-thumb img{width:100%;display:block}
.video-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.video-play-btn{width:50px;height:50px;background:rgba(79,110,247,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.video-iframe{position:relative;padding-bottom:56.25%;border-radius:10px;overflow:hidden;background:#000}
.video-iframe iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* ── EX CARDS ── */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ex-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .15s}
.ex-card:hover{border-color:#c5cbf9;box-shadow:0 4px 16px rgba(79,110,247,.1);transform:translateY(-1px)}
.ex-thumb{position:relative;height:120px;background:#f0f2ff;overflow:hidden}
.ex-thumb img{width:100%;height:100%;object-fit:cover}
.ex-thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px}
.ex-play-icon{position:absolute;top:8px;right:8px;background:rgba(79,110,247,.9);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px}
.ex-tags{position:absolute;bottom:6px;left:6px;display:flex;gap:3px;flex-wrap:wrap}
.ex-body{padding:10px 12px}
.ex-name{font-weight:700;font-size:13px;margin-bottom:5px}

/* ── MISC ── */
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.section-title{font-weight:800;font-size:17px;margin-bottom:14px}
.flex{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hidden{display:none!important}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}

/* ── MACRO CARDS ── */
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.macro-card{background:#f9fafb;border:1px solid var(--border);border-radius:10px;padding:11px;text-align:center}
.macro-val{font-size:19px;font-weight:800}
.macro-lbl{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}

/* ── TRAINING ── */
.day-block{background:#f9fafb;border:1px solid var(--border);border-radius:11px;margin-bottom:12px;overflow:hidden}
.day-hd{background:var(--accent);color:#fff;padding:10px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.ex-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.ex-row:last-child{border-bottom:none}
.ex-row-info{flex:1}
.ex-row-name{font-weight:600;font-size:13px;margin-bottom:2px}
.ex-row-meta{font-size:11px;color:var(--muted)}

/* ── MESSAGES ── */
.msg-bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;margin-bottom:8px}
.msg-trainer{background:#eef0ff;color:var(--accent);border-radius:14px 14px 14px 4px;align-self:flex-start}
.msg-system{background:#f9fafb;color:var(--muted);border-radius:10px;font-size:12px;text-align:center;padding:6px 12px;margin:8px auto}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef0ff,#f5f6fa)}
.login-card{background:var(--white);border-radius:18px;padding:36px;width:350px;box-shadow:0 8px 32px rgba(79,110,247,.12)}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar" class="topbar hidden">
  <span class="logo">i-Motion</span>
  <div class="topbar-right" id="topbar-right"></div>
</div>

<!-- LAYOUT -->
<div id="layout" class="layout hidden">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div id="app"></div></main>
</div>

<!-- LOGIN -->
<div id="login-page" class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:26px;font-weight:800;color:var(--accent);letter-spacing:-1px">i-Motion</div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px">EMS Personal Training</div>
    </div>
    <div style="margin-bottom:12px"><label class="lbl">Email</label><input id="l-email" type="email" placeholder="trainer@imotion.com"/></div>
    <div style="margin-bottom:20px"><label class="lbl">Contraseña</label><input id="l-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div id="l-err" style="color:var(--danger);font-size:12px;margin-bottom:10px;text-align:center"></div>
    <button class="btn" style="width:100%;justify-content:center;padding:11px" id="l-btn" onclick="doLogin()">Entrar</button>
    <div style="margin-top:18px;text-align:center;font-size:11px;color:var(--muted);line-height:1.9">
      trainer@imotion.com · imotion2024<br>carlos@demo.com / maria@demo.com · 1234
    </div>
  </div>
</div>

<script>
// ═══════════════ CONFIG ═══════════════
const API="https://script.google.com/macros/s/AKfycbw9zUMlHGIbwZclvRmVQU1mSWQib2c5W44cUR4RXvO-h2waJr1WLc1l61Iz123HgA8tGA/exec";

// ═══════════════ STATE ═══════════════
let USER=null,TAB=null;
let CLIENTS=[],ROUTINES=[],NUTRITION=[];

// ═══════════════ API ═══════════════
async function api(params){
  const r=await fetch(API+"?"+new URLSearchParams(params));
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||"Error");
  return j.data;
}

// ═══════════════ UTILS ═══════════════
function render(h){document.getElementById("app").innerHTML=h;}
function spin(t="Cargando…"){return`<div style="text-align:center;padding:60px"><div class="spinner"></div><div style="color:var(--muted);margin-top:14px;font-size:13px">${t}</div></div>`;}
function closeModal(id){document.getElementById(id)?.remove();}
function ytId(url){return(url||"").match(/(?:embed\/|v=|youtu\.be\/)([^?&\s]+)/)?.[1]||"";}
function ytThumb(url){const id=ytId(url);return id?`https://img.youtube.com/vi/${id}/mqdefault.jpg`:"";}
function ytEmbed(url){const id=ytId(url);return id?`https://www.youtube.com/embed/${id}?rel=0&modestbranding=1`:"";}

// ═══════════════ LOGIN ═══════════════
async function doLogin(){
  const email=document.getElementById("l-email").value.trim();
  const pass=document.getElementById("l-pass").value;
  const btn=document.getElementById("l-btn");
  const err=document.getElementById("l-err");
  if(!email||!pass)return;
  btn.disabled=true;btn.textContent="Verificando…";err.textContent="";
  try{
    const u=await api({action:"login",email,password:pass});
    USER=u;
    TAB=u.rol==="trainer"?"clients":"training";
    document.getElementById("login-page").classList.add("hidden");
    document.getElementById("topbar").classList.remove("hidden");
    document.getElementById("layout").classList.remove("hidden");
    renderTopbar();renderSidebar();renderTab();
  }catch(e){err.textContent=e.message;btn.disabled=false;btn.textContent="Entrar";}
}

function logout(){
  USER=null;
  document.getElementById("login-page").classList.remove("hidden");
  document.getElementById("topbar").classList.add("hidden");
  document.getElementById("layout").classList.add("hidden");
}

// ═══════════════ TOPBAR ═══════════════
function renderTopbar(){
  document.getElementById("topbar-right").innerHTML=`
    <span style="font-size:12px;color:var(--muted)">${USER.nombre}</span>
    <div class="avatar">${USER.nombre[0]}</div>
    <button class="btn-ghost" onclick="logout()">Salir</button>`;
}

// ═══════════════ SIDEBAR ═══════════════
function renderSidebar(){
  const trainerItems=[
    {id:"clients",icon:"👥",label:"Clientes"},
    {id:"routines",icon:"⚡",label:"Rutinas"},
    {id:"nutrition",icon:"🥗",label:"Nutrición"},
    {id:"exercises",icon:"📚",label:"Ejercicios"},
  ];
  const clientItems=[
    {id:"training",icon:"💪",label:"Mi Entrenamiento"},
    {id:"mynutrition",icon:"🥗",label:"Mi Nutrición"},
    {id:"messages",icon:"💬",label:"Mensajes"},
  ];
  const items=USER.rol==="trainer"?trainerItems:clientItems;
  document.getElementById("sidebar").innerHTML=`
    <div class="sidebar-section">Menú</div>
    ${items.map(it=>`
      <button class="sidebar-item${TAB===it.id?" active":""}" onclick="setTab('${it.id}')">
        <span class="sidebar-icon">${it.icon}</span>${it.label}
      </button>`).join("")}`;
}

function setTab(t){TAB=t;renderSidebar();renderTab();}
function renderTab(){
  const map={
    clients:renderClients,routines:renderRoutines,
    nutrition:renderNutrition,exercises:renderExercises,
    training:renderTraining,mynutrition:renderMyNutrition,
    messages:renderMessages,
  };
  (map[TAB]||renderClients)();
}

// ═══════════════════════════════════════
// TRAINER — CLIENTES
// ═══════════════════════════════════════
async function renderClients(){
  render(spin("Cargando clientes…"));
  [CLIENTS,ROUTINES,NUTRITION]=await Promise.all([
    api({action:"clients"}),api({action:"routines"}),api({action:"nutrition"})
  ]);
  render(`
    <div class="flex-between" style="margin-bottom:18px">
      <div class="section-title" style="margin-bottom:0">Clientes</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">
      ${CLIENTS.map(c=>{
        const r=ROUTINES.find(r=>String(r.clienteId)===String(c.id));
        const n=NUTRITION.find(n=>String(n.clienteId)===String(c.id));
        return `<div class="card card-hover" onclick="openClient('${c.id}')">
          <div class="flex" style="margin-bottom:14px">
            <div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6c63ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0">${c.nombre[0]}</div>
            <div>
              <div style="font-weight:700;font-size:15px">${c.nombre}</div>
              <div style="font-size:12px;color:var(--muted)">${c.email}</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:7px">
            <div class="flex-between"><span style="font-size:12px;color:var(--muted)">Rutina</span>${r?`<span class="tag tag-green">${r.nombre}</span>`:`<span class="tag tag-orange">Sin asignar</span>`}</div>
            <div class="flex-between"><span style="font-size:12px;color:var(--muted)">Nutrición</span>${n?`<span class="tag tag-green">${n.nombre}</span>`:`<span class="tag tag-orange">Sin asignar</span>`}</div>
          </div>
        </div>`;
      }).join("")}
    </div>`);
}

async function openClient(clientId){
  const c=CLIENTS.find(c=>String(c.id)===String(clientId));
  const r=ROUTINES.find(r=>String(r.clienteId)===String(clientId));
  const n=NUTRITION.find(n=>String(n.clienteId)===String(clientId));

  document.body.insertAdjacentHTML("beforeend",`
    <div class="modal-bg" id="cm" onclick="if(event.target===this)closeModal('cm')">
      <div class="modal" style="max-width:640px">
        <div class="modal-hd">
          <div class="flex" style="gap:12px">
            <div style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#6c63ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px">${c.nombre[0]}</div>
            <div><div class="modal-title">${c.nombre}</div><div style="font-size:12px;color:var(--muted)">${c.email}</div></div>
          </div>
          <button class="modal-close" onclick="closeModal('cm')">✕</button>
        </div>

        <!-- TABS -->
        <div style="display:flex;border-bottom:1px solid var(--border);padding:0 22px">
          ${[["ct-train","💪 Entrenamiento"],["ct-nutri","🥗 Nutrición"],["ct-msg","💬 Mensaje"]].map(([id,lbl],i)=>`
            <button id="${id}" onclick="clientTab('${id}')" style="background:none;border:none;border-bottom:2px solid ${i===0?'var(--accent)':'transparent'};color:${i===0?'var(--accent)':'var(--muted)'};padding:10px 14px;font-size:13px;font-weight:${i===0?700:500};cursor:pointer;font-family:'Inter',sans-serif">${lbl}</button>`).join("")}
        </div>

        <div class="modal-body">

          <!-- ENTRENAMIENTO -->
          <div id="ct-train-c">
            <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Rutina asignada</div>
            ${ROUTINES.map(rt=>`
              <div onclick="assignRoutine('${rt.id}','${clientId}')" style="border:1.5px solid ${r?.id==rt.id?'var(--accent)':'var(--border)'};border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:${r?.id==rt.id?'#f5f7ff':'var(--white)'}">
                <div><div style="font-weight:600;font-size:13px">${rt.nombre}</div><div style="font-size:11px;color:var(--muted)">${rt.days?.length||0} días</div></div>
                ${r?.id==rt.id?'<span class="tag tag-blue">✓ Asignada</span>':'<span style="font-size:12px;color:var(--accent);font-weight:600">Asignar →</span>'}
              </div>`).join("")}
            ${ROUTINES.length===0?`<div style="color:var(--muted);font-size:13px;margin-bottom:12px">No hay rutinas. Créalas en la pestaña Rutinas.</div>`:""}
            <button class="btn-outline" onclick="closeModal('cm');setTab('routines')" style="width:100%;justify-content:center;font-size:12px;margin-top:4px">+ Crear nueva rutina</button>
          </div>

          <!-- NUTRICIÓN -->
          <div id="ct-nutri-c" class="hidden">
            <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Plan nutricional</div>
            ${n?`<div class="card" style="margin-bottom:14px;background:#f9fafb">
              <div style="font-weight:700;margin-bottom:4px">${n.nombre}</div>
              <div style="font-size:12px;color:var(--muted)">${n.kcal} kcal · P:${n.proteina}g · C:${n.carbos}g · G:${n.grasas}g</div>
            </div>`:""}
            <button class="btn" onclick="closeModal('cm');setTab('nutrition')" style="width:100%;justify-content:center">
              ${n?"Cambiar plan nutricional":"+ Asignar plan nutricional"}
            </button>
          </div>

          <!-- MENSAJE -->
          <div id="ct-msg-c" class="hidden">
            <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Enviar mensaje a ${c.nombre}</div>
            <textarea id="msg-text" placeholder="Escribe aquí tu mensaje, indicaciones o motivación…" style="min-height:120px;resize:vertical;margin-bottom:10px"></textarea>
            <button class="btn" style="width:100%;justify-content:center" onclick="sendMsg('${clientId}')">📤 Enviar mensaje</button>
            <div id="msg-status" style="margin-top:8px;font-size:12px;text-align:center"></div>
          </div>

        </div>
      </div>
    </div>`);
}

function clientTab(id){
  ["ct-train","ct-nutri","ct-msg"].forEach(t=>{
    const btn=document.getElementById(t);
    const con=document.getElementById(t+"-c");
    const active=t===id;
    if(btn){btn.style.borderBottomColor=active?"var(--accent)":"transparent";btn.style.color=active?"var(--accent)":"var(--muted)";btn.style.fontWeight=active?"700":"500";}
    if(con)con.classList.toggle("hidden",!active);
  });
}

async function assignRoutine(routineId,clientId){
  await api({action:"assignRoutine",routineId,clienteId:clientId});
  closeModal("cm");renderClients();
}

async function sendMsg(clientId){
  const text=document.getElementById("msg-text").value.trim();
  if(!text)return;
  const status=document.getElementById("msg-status");
  status.textContent="Enviando…";status.style.color="var(--muted)";
  try{

function toggleDone(k,checked){
  const el=document.getElementById(`exn-${k}`);
  if(el){el.style.textDecoration=checked?"line-through":"none";el.style.color=checked?"var(--muted)":"var(--text)";}
}

function playVideo(k,encodedUrl){
  const url=decodeURIComponent(encodedUrl);
  const panel=document.getElementById(`vid-${k}`);
  const iframe=document.getElementById(`iframe-${k}`);
  if(!panel||!iframe)return;
  if(!panel.classList.contains("hidden")){
    panel.classList.add("hidden");iframe.src="";return;
  }
  // Handle different video types
  let embedUrl="";
  if(url.includes("youtube")||url.includes("youtu.be")){
    embedUrl=ytEmbed(url);
  }else if(url.includes("drive.google.com")){
    // Google Drive: convert to embed
    const fileId=url.match(/\/d\/([^/]+)/)?.[1]||url.match(/id=([^&]+)/)?.[1];
    if(fileId)embedUrl=`https://drive.google.com/file/d/${fileId}/preview`;
  }else{
    embedUrl=url;
  }
  iframe.src=embedUrl;
  panel.classList.remove("hidden");
  panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

      <div style="color:var(--muted);font-size:13px;margin-bottom:18px">${fullPlan.kcal} kcal/día</div>
      <div class="macro-row" style="margin-bottom:18px">
        ${[{l:"Calorías",v:fullPlan.kcal,c:"#e08a00"},{l:"Proteína",v:fullPlan.proteina_g+"g",c:"#4f6ef7"},{l:"Carbos",v:fullPlan.carbos_g+"g",c:"#00a87a"},{l:"Grasas",v:fullPlan.grasas_g+"g",c:"#7c5cbf"}]
          .map(x=>`<div class="macro-card"><div class="macro-val" style="color:${x.c}">${x.v}</div><div class="macro-lbl">${x.l}</div></div>`).join("")}
      </div>
      ${fullPlan.comidas.map((meal,mi)=>`
        <div class="card" style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <span style="font-size:22px">${meal.icono||"🍽️"}</span>
            <div>
              <div style="font-weight:700;font-size:14px">${meal.nombre}</div>
              <div style="font-size:12px;color:var(--muted)">${meal.hora} · ~${meal.kcal} kcal</div>
            </div>
          </div>
          ${(meal.variantes||[]).length>0?`
            <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
              ${meal.variantes.map((v,vi)=>`<button id="mvt-${mi}-${vi}" onclick="selectMealVariant(${mi},${vi},${meal.variantes.length})" style="background:${vi===0?'var(--accent)':'#f0f2f5'};color:${vi===0?'#fff':'var(--muted)'};border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">Opción ${v.letra}</button>`).join("")}
            </div>
            ${meal.variantes.map((v,vi)=>`
              <div id="mvp-${mi}-${vi}" style="display:${vi===0?'block':'none'}">
                <div style="font-weight:600;margin-bottom:6px;font-size:13px">${v.nombre}</div>
                <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">
                  ${(v.ing||[]).map(i=>`<span class="tag tag-blue">${i}</span>`).join("")}
                </div>
                <div style="background:#f9fafb;border-radius:9px;padding:12px">
                  ${(v.pasos||[]).map((p,pi)=>`<div style="display:flex;gap:8px;margin-bottom:6px;font-size:12px;line-height:1.5"><span style="background:var(--accent);color:#fff;border-radius:50%;width:18px;height:18px;min-width:18px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-top:1px">${pi+1}</span><span>${p}</span></div>`).join("")}
                </div>
              </div>`).join("")}`:""}
        </div>`).join("")}`);
  }else{
    const plans=await api({action:"nutrition",clientId:USER.id}).catch(()=>[]);
    if(!plans||!plans[0]){
      render(`<div style="text-align:center;padding:60px;color:var(--muted)"><div style="font-size:48px;margin-bottom:16px">🥗</div><div style="font-weight:700;font-size:16px">Sin plan nutricional</div><div style="font-size:13px;margin-top:6px">Tu entrenador te asignará un plan pronto.</div></div>`);
      return;
    }
    const p=plans[0];
    const meals=(p.comidas?String(p.comidas).split("|"):[]);
    render(`
      <div style="font-weight:800;font-size:20px;margin-bottom:18px">Mi Plan Nutricional</div>
      <div class="macro-row">
        ${[{l:"Calorías",v:p.kcal,c:"#e08a00"},{l:"Proteína",v:p.proteina+"g",c:"#4f6ef7"},{l:"Carbos",v:p.carbos+"g",c:"#00a87a"},{l:"Grasas",v:p.grasas+"g",c:"#7c5cbf"}]
          .map(x=>`<div class="macro-card"><div class="macro-val" style="color:${x.c}">${x.v}</div><div class="macro-lbl">${x.l}</div></div>`).join("")}
      </div>
      ${meals.map((m,i)=>`<div style="display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:1px">${i+1}</span><span>${m}</span></div>`).join("")}`);
  }
}

function selectMealVariant(mi,vi,total){
  for(let i=0;i<total;i++){
    const btn=document.getElementById(`mvt-${mi}-${i}`);
    const panel=document.getElementById(`mvp-${mi}-${i}`);
    if(btn){btn.style.background=i===vi?"var(--accent)":"#f0f2f5";btn.style.color=i===vi?"#fff":"var(--muted)";}
    if(panel)panel.style.display=i===vi?"block":"none";
  }
}

async function renderMessages(){
  render(spin("Cargando mensajes…"));
  let msg="";
  try{
    const users=await api({action:"clients"});
    // Get comment from user data - need a getComment endpoint
    msg=await api({action:"getComment",clienteId:USER.id}).catch(()=>"");
  }catch(e){}

  render(`
    <div style="font-weight:800;font-size:20px;margin-bottom:18px">💬 Mensajes</div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px">Mensaje de tu entrenador</div>
      ${msg?`
        <div style="background:#eef0ff;border-radius:12px;padding:16px;font-size:14px;color:var(--text);line-height:1.6;border-left:3px solid var(--accent)">
          <div style="font-size:11px;color:var(--accent);font-weight:700;margin-bottom:6px">✉️ De: Ric — i-Motion EMS</div>
          ${msg}
        </div>`:`
        <div style="text-align:center;padding:30px;color:var(--muted)">
          <div style="font-size:32px;margin-bottom:10px">📭</div>
          <div style="font-size:13px">No tienes mensajes por ahora.</div>
        </div>`}
    </div>`);
}
